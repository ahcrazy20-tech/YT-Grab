name: VideoDownloaderPro
options:
  bundleIdPrefix: com.videopro
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  VideoDownloaderPro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VideoDownloaderPro
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videopro.app
        INFOPLIST_FILE: VideoDownloaderPro/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
