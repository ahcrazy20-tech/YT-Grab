# ============================================================================
#  BUILD.yml  —  ملف واحد يبني تطبيق "YT Grab" بالكامل لوحده
#  ----------------------------------------------------------------------------
#  هذا الملف "مكتفٍ ذاتياً" (Self-Contained):
#  لما تشغّله على GitHub Actions، هو نفسه يكتب كل ملفات المشروع (Swift + أيقونة
#  + إعدادات المشروع)، ثم يثبّت XcodeGen، يولّد مشروع Xcode، يبنيه بدون توقيع،
#  ويحزمه كملف .ipa و .tipa جاهز للتثبيت عبر TrollStore.
#
#  ✔ لا تحتاج رفع أي ملف آخر. ارفع هذا الملف فقط على المسار:
#      .github/workflows/BUILD.yml
#
#  متوافق مع: iPhone 11 Pro Max / iOS 16.4 (TrollStore)
# ============================================================================
name: Build YTGrab for TrollStore (one file)

on:
  workflow_dispatch:                    # تشغيل يدوي من تبويب Actions
  push:
    branches: [ "main", "master" ]      # تشغيل تلقائي عند أي تعديل

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      # ----------------------------------------------------------------------
      # 1) هذا هو أهم جزء: توليد كل ملفات المشروع تلقائياً
      # ----------------------------------------------------------------------
      - name: Generate all project files
        shell: bash
        run: |
          set -eo pipefail
          echo "==> كتابة ملفات المشروع..."

          gen() {
            mkdir -p "$(dirname "$1")"
            cat > "$1"
          }

          # ---------------- project.yml ----------------
          gen project.yml <<'YMLEOF'
          name: YTGrab
          options:
            bundleIdPrefix: com.ytgrab
            deploymentTarget:
              iOS: "16.0"
            projectFormat: "xcode15_0"
            xcodeVersion: "15.0"
            createIntermediateGroups: true

          targets:
            YTGrab:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: "YT Grab"
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UIBackgroundModes:
                    - audio
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  LSApplicationCategoryType: "public.app-category.video"
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_NAME: YTGrab
                  PRODUCT_BUNDLE_IDENTIFIER: com.ytgrab.app
                  SWIFT_VERSION: "5.9"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: false
                  CODE_SIGN_STYLE: Automatic

          schemes:
            YTGrab:
              build:
                targets:
                  YTGrab: all
              run:
                config: Debug
              archive:
                config: Release
          YMLEOF

          # ---------------- Asset catalog ----------------
          gen Sources/Assets.xcassets/Contents.json <<'JSONEOF'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSONEOF

          gen Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSONEOF'
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSONEOF

          # ---------------- Info.plist (ضمان وجود ملف إعدادات التطبيق) ----------------
          gen Sources/Info.plist <<'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>$(DEVELOPMENT_LANGUAGE)</string>
            <key>CFBundleDisplayName</key>
            <string>YT Grab</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.video</string>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
            <key>UIBackgroundModes</key>
            <array>
              <string>audio</string>
            </array>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          PLISTEOF

          # ---------------- App icon (مولّدة برمجياً بدون أي اعتماديات) ----------------
          python3 - <<'PYEOF'
          import zlib, struct, os
          os.makedirs("Sources/Assets.xcassets/AppIcon.appiconset", exist_ok=True)
          W = H = 1024
          def clamp(v): return max(0, min(255, int(v)))
          def in_tri(px, py, ax, ay, bx, by, cx, cy):
              d1 = (px-bx)*(ay-by) - (ax-bx)*(py-by)
              d2 = (px-cx)*(by-cy) - (bx-cx)*(py-cy)
              d3 = (px-ax)*(cy-ay) - (cx-ax)*(py-ay)
              neg = (d1 < 0) or (d2 < 0) or (d3 < 0)
              pos = (d1 > 0) or (d2 > 0) or (d3 > 0)
              return not (neg and pos)
          rows = []
          for y in range(H):
              row = bytearray(b'\x00')
              for x in range(W):
                  t = (x + y) / (2 * W)
                  r, g, b = clamp(20 + 44*t), clamp(14 + 14*t), clamp(42 + 72*t)
                  col = (r, g, b)
                  if in_tri(x, y, 400, 320, 400, 704, 690, 512):
                      tt = (x - 400) / 290.0
                      col = (clamp(255 - 105*tt), clamp(80 + 10*tt), clamp(170 + 85*tt))
                      if 482 <= x <= 542 and 430 <= y <= 555:
                          col = (255, 255, 255)
                      if in_tri(x, y, 438, 555, 586, 555, 512, 618):
                          col = (255, 255, 255)
                  row += bytes(col)
              rows.append(bytes(row))
          raw = b''.join(rows)
          def chunk(typ, data):
              return struct.pack('>I', len(data)) + typ + data + struct.pack('>I', zlib.crc32(typ + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          open("Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png", "wb").write(png)
          print("App icon generated OK:", len(png), "bytes")
          PYEOF

          # ---------------- App entry ----------------
          gen Sources/App/YTGrabApp.swift <<'SWIFTEOF'
          import SwiftUI

          @main
          struct YTGrabApp: App {
              @StateObject private var library = LibraryStore()
              @StateObject private var settings = SettingsStore()

              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .environmentObject(library)
                          .environmentObject(settings)
                          .environment(\.layoutDirection, .rightToLeft)
                          .preferredColorScheme(.dark)
                  }
              }
          }

          struct RootView: View {
              var body: some View {
                  TabView {
                      HomeView()
                          .tabItem { Label("تحميل", systemImage: "arrow.down.circle.fill") }
                      LibraryView()
                          .tabItem { Label("المكتبة", systemImage: "folder.fill") }
                      SettingsView()
                          .tabItem { Label("الإعدادات", systemImage: "gearshape.fill") }
                  }
              }
          }
          SWIFTEOF

          # ---------------- Models ----------------
          gen Sources/Models/Models.swift <<'SWIFTEOF'
          import Foundation

          struct SavedVideo: Identifiable, Codable, Hashable {
              var id = UUID()
              var title: String
              var sourceURL: String
              var relativePath: String
              var service: String
              var quality: String
              var format: String
              var fileSize: Int64
              var duration: Double?
              var thumbnailName: String?
              var downloadedAt: Date = Date()

              var fileURL: URL? {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first
                  return docs?.appendingPathComponent(relativePath)
              }
          }

          struct InstanceConfig: Identifiable, Codable, Hashable {
              var id = UUID()
              var name: String
              var url: String
              var path: String
              var apiKey: String
              var bearerToken: String
              var enabled: Bool = true
          }

          enum DownloadKind: String, Codable, CaseIterable, Identifiable {
              case auto, audio, mute
              var id: String { rawValue }
              var label: String {
                  switch self {
                  case .auto: return "فيديو + صوت"
                  case .audio: return "صوت فقط"
                  case .mute: return "فيديو صامت"
                  }
              }
          }
          SWIFTEOF

          # ---------------- Engine: Cobalt client ----------------
          gen Sources/Engine/CobaltClient.swift <<'SWIFTEOF'
          import Foundation

          struct CobaltPickerItem: Codable, Hashable {
              var type: String?
              var url: String?
              var thumb: String?
          }

          struct CobaltErrorContext: Codable {
              var service: String?
              var limit: Double?
          }

          struct CobaltErrorBody: Codable {
              var code: String?
              var context: CobaltErrorContext?
          }

          struct CobaltResponse: Codable {
              var status: String?
              var url: String?
              var filename: String?
              var audioFilename: String?
              var picker: [CobaltPickerItem]?
              var error: CobaltErrorBody?
              var text: String?
          }

          enum ExtractOutcome {
              case downloadable(url: URL, filename: String?)
              case picker([CobaltPickerItem])
          }

          enum EngineError: LocalizedError {
              case invalidURL
              case noInstances
              case unsupportedService(String)
              case needsAuth(String)
              case rateLimited(String)
              case server(String)
              case notFound

              var errorDescription: String? {
                  switch self {
                  case .invalidURL:
                      return "الرابط غير صالح. تأكد أنك نسخت رابط الفيديو كاملاً."
                  case .noInstances:
                      return "لا توجد مثيلات مفعّلة. أضف مثيلاً من الإعدادات."
                  case .unsupportedService(let s):
                      return s.isEmpty ? "هذا الموقع غير مدعوم حالياً." : "الموقع «\(s)» غير مدعوم حالياً."
                  case .needsAuth(let name):
                      return "المثيل «\(name)» يطلب مفتاح API. أضف مفتاحك من الإعدادات، أو شغّل مثيلك الخاص."
                  case .rateLimited(let name):
                      return "تم تجاوز حد الطلبات في «\(name)». انتظر قليلاً أو جرّب مثيلاً آخر."
                  case .server(let code):
                      return "خطأ من الخادم: \(code)"
                  case .notFound:
                      return "لم يتم العثور على الفيديو. قد يكون محذوفاً أو خاصاً."
                  }
              }
          }

          final class CobaltClient {

              static let qualityOptions = ["max", "2160", "1440", "1080", "720", "480", "360", "240", "144"]

              static func extract(source: String,
                                  instances: [InstanceConfig],
                                  kind: DownloadKind,
                                  quality: String,
                                  audioFormat: String) async throws -> ExtractOutcome {

                  let active = instances.filter {
                      $0.enabled && !$0.url.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty
                  }
                  guard !active.isEmpty else { throw EngineError.noInstances }

                  var body: [String: Any] = [
                      "url": source,
                      "downloadMode": kind.rawValue,
                      "videoQuality": quality,
                      "audioFormat": audioFormat,
                      "filenameStyle": "basic",
                      "youtubeVideoCodec": "h264"
                  ]
                  if kind == .audio { body.removeValue(forKey: "videoQuality") }
                  if kind == .mute { body.removeValue(forKey: "audioFormat") }

                  var best: EngineError = .server("غير معروف")
                  var bestRank = 0

                  for instance in active {
                      do {
                          let resp = try await request(instance: instance, body: body)
                          switch resp.status {
                          case "tunnel", "redirect":
                              if let raw = resp.url, let u = URL(string: raw) {
                                  return .downloadable(url: u, filename: resp.filename)
                              }
                              if 1 > bestRank { best = .server("لم يُرجع الخادم رابط تحميل"); bestRank = 1 }
                          case "picker":
                              if let items = resp.picker, !items.isEmpty {
                                  return .picker(items)
                              }
                              if rank(.notFound) > bestRank { best = .notFound; bestRank = rank(.notFound) }
                          case "error":
                              let code = resp.error?.code ?? ""
                              let text = resp.text ?? ""
                              let service = resp.error?.context?.service ?? ""
                              let e = mapError(code: code, text: text, service: service, instance: instance)
                              if rank(e) > bestRank { best = e; bestRank = rank(e) }
                          default:
                              if 1 > bestRank { best = .server("استجابة غير مفهومة"); bestRank = 1 }
                          }
                      } catch {
                          let e = (error as? EngineError) ?? .server(error.localizedDescription)
                          if rank(e) > bestRank { best = e; bestRank = rank(e) }
                      }
                  }
                  throw best
              }

              private static func mapError(code: String, text: String, service: String, instance: InstanceConfig) -> EngineError {
                  if code.contains("auth") { return .needsAuth(instance.name) }
                  if code.contains("rate") || code.contains("limit") { return .rateLimited(instance.name) }
                  if code.contains("unsupported") { return .unsupportedService(service) }
                  if code.contains("not_found") || code.contains("not found") { return .notFound }
                  if code.isEmpty && !text.isEmpty {
                      return .server("تعذّرت المعالجة على «\(instance.name)»")
                  }
                  return .server(code)
              }

              private static func rank(_ e: EngineError) -> Int {
                  switch e {
                  case .unsupportedService: return 5
                  case .notFound: return 4
                  case .rateLimited: return 3
                  case .needsAuth: return 2
                  default: return 1
                  }
              }

              static func request(instance: InstanceConfig, body: [String: Any]) async throws -> CobaltResponse {
                  var base = instance.url.trimmingCharacters(in: .whitespacesAndNewlines)
                  while base.hasSuffix("/") { base.removeLast() }

                  var path = instance.path.trimmingCharacters(in: .whitespacesAndNewlines)
                  if path.isEmpty { path = "/" } else if !path.hasPrefix("/") { path = "/" + path }

                  guard let endpoint = URL(string: base + path) else { throw EngineError.invalidURL }

                  var req = URLRequest(url: endpoint)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Accept")
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  if !instance.apiKey.isEmpty {
                      req.setValue("Api-Key \(instance.apiKey)", forHTTPHeaderField: "Authorization")
                  } else if !instance.bearerToken.isEmpty {
                      req.setValue("Bearer \(instance.bearerToken)", forHTTPHeaderField: "Authorization")
                  }
                  req.timeoutInterval = 120
                  req.httpBody = try JSONSerialization.data(withJSONObject: body)

                  let (data, _) = try await URLSession.shared.data(for: req)
                  if let decoded = try? JSONDecoder().decode(CobaltResponse.self, from: data) {
                      return decoded
                  }
                  throw EngineError.server("استجابة غير متوقعة من «\(instance.name)»")
              }
          }
          SWIFTEOF

          # ---------------- Engine: metadata ----------------
          gen Sources/Engine/MetadataFetcher.swift <<'SWIFTEOF'
          import Foundation

          struct VideoMeta {
              var title: String?
              var thumbnailURL: String?
              var service: String

              static let empty = VideoMeta(title: nil, thumbnailURL: nil, service: "")
          }

          struct OEmbedResponse: Codable {
              var title: String?
              var thumbnail_url: String?
              var provider_name: String?
              var author_name: String?
          }

          enum MetadataFetcher {

              private static let unreserved = CharacterSet(charactersIn:
                  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~")

              static func serviceName(for url: String) -> String {
                  let host = hostOf(url) ?? ""
                  if host.contains("youtu") { return "YouTube" }
                  if host.contains("tiktok") { return "TikTok" }
                  if host.contains("twitter") || host.contains("x.com") { return "X / Twitter" }
                  if host.contains("instagram") { return "Instagram" }
                  if host.contains("reddit") { return "Reddit" }
                  if host.contains("vimeo") { return "Vimeo" }
                  if host.contains("soundcloud") { return "SoundCloud" }
                  if host.contains("facebook") || host.contains("fb.com") { return "Facebook" }
                  if host.contains("twitch") { return "Twitch" }
                  if host.contains("tumblr") { return "Tumblr" }
                  if host.contains("bilibili") { return "Bilibili" }
                  if host.contains("pinterest") { return "Pinterest" }
                  return host
              }

              static func hostOf(_ urlString: String) -> String? {
                  guard let url = URL(string: urlString), let host = url.host else { return nil }
                  return host
              }

              static func fetch(for urlString: String) async -> VideoMeta {
                  let service = serviceName(for: urlString)
                  guard URL(string: urlString) != nil else {
                      return VideoMeta(title: nil, thumbnailURL: nil, service: service)
                  }

                  var oembed: String?
                  switch service {
                  case "YouTube":
                      oembed = "https://www.youtube.com/oembed?url=\(esc(urlString))&format=json"
                  case "TikTok":
                      oembed = "https://www.tiktok.com/oembed?url=\(esc(urlString))"
                  case "Vimeo":
                      oembed = "https://vimeo.com/api/oembed.json?url=\(esc(urlString))"
                  default:
                      oembed = nil
                  }

                  guard let endpoint = oembed, let u = URL(string: endpoint) else {
                      return VideoMeta(title: nil, thumbnailURL: nil, service: service)
                  }

                  var req = URLRequest(url: u)
                  req.timeoutInterval = 20
                  if let (data, _) = try? await URLSession.shared.data(for: req),
                     let decoded = try? JSONDecoder().decode(OEmbedResponse.self, from: data) {
                      return VideoMeta(title: decoded.title,
                                       thumbnailURL: decoded.thumbnail_url,
                                       service: service)
                  }
                  return VideoMeta(title: nil, thumbnailURL: nil, service: service)
              }

              private static func esc(_ s: String) -> String {
                  s.addingPercentEncoding(withAllowedCharacters: unreserved) ?? s
              }
          }
          SWIFTEOF

          # ---------------- Engine: file downloader ----------------
          gen Sources/Engine/FileDownloader.swift <<'SWIFTEOF'
          import Foundation

          final class FileDownloader: NSObject, URLSessionDownloadDelegate {

              private var onProgress: ((Double) -> Void)?
              private var continuation: CheckedContinuation<URL, Error>?
              private var targetURL: URL?
              private var finished = false

              private lazy var session: URLSession = URLSession(configuration: .default,
                                                                 delegate: self,
                                                                 delegateQueue: .main)

              func download(url: URL,
                            to destination: URL,
                            progress: @escaping (Double) -> Void) async throws -> URL {
                  finished = false
                  onProgress = progress
                  targetURL = destination

                  return try await withCheckedThrowingContinuation { cont in
                      self.continuation = cont
                      var req = URLRequest(url: url)
                      req.timeoutInterval = 900
                      req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 16_4 like Mac OS X) AppleWebKit/605.1.15",
                                   forHTTPHeaderField: "User-Agent")
                      let task = session.downloadTask(with: req)
                      task.resume()
                  }
              }

              func urlSession(_ session: URLSession,
                              downloadTask: URLSessionDownloadTask,
                              didWriteData bytesWritten: Int64,
                              totalBytesWritten: Int64,
                              totalBytesExpectedToWrite: Int64) {
                  guard totalBytesExpectedToWrite > 0 else { return }
                  onProgress?(Double(totalBytesWritten) / Double(totalBytesExpectedToWrite))
              }

              func urlSession(_ session: URLSession,
                              downloadTask: URLSessionDownloadTask,
                              didFinishDownloadingTo location: URL) {
                  guard !finished else { return }
                  do {
                      guard let target = targetURL else { throw EngineError.server("لا يوجد مسار حفظ") }
                      try? FileManager.default.removeItem(at: target)
                      try FileManager.default.createDirectory(at: target.deletingLastPathComponent(),
                                                             withIntermediateDirectories: true)
                      try FileManager.default.moveItem(at: location, to: target)
                      finished = true
                      continuation?.resume(returning: target)
                      continuation = nil
                  } catch {
                      finished = true
                      continuation?.resume(throwing: error)
                      continuation = nil
                  }
              }

              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let error = error, !finished else { return }
                  finished = true
                  continuation?.resume(throwing: error)
                  continuation = nil
              }
          }
          SWIFTEOF

          # ---------------- Store: library ----------------
          gen Sources/Store/LibraryStore.swift <<'SWIFTEOF'
          import Foundation
          import Combine

          final class LibraryStore: ObservableObject {

              @Published var items: [SavedVideo] = []

              private let indexURL: URL
              private let thumbDir: URL
              private let downloadsDir: URL

              init() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  indexURL = docs.appendingPathComponent("library.json")
                  thumbDir = docs.appendingPathComponent("Thumbnails")
                  downloadsDir = docs.appendingPathComponent("Downloads")
                  try? FileManager.default.createDirectory(at: thumbDir, withIntermediateDirectories: true)
                  try? FileManager.default.createDirectory(at: downloadsDir, withIntermediateDirectories: true)
                  load()
              }

              private func load() {
                  guard let data = try? Data(contentsOf: indexURL),
                        let decoded = try? JSONDecoder().decode([SavedVideo].self, from: data) else { return }
                  items = decoded
              }

              private func persist() {
                  if let data = try? JSONEncoder().encode(items) {
                      try? data.write(to: indexURL, options: .atomic)
                  }
              }

              func add(_ item: SavedVideo) {
                  items.removeAll { $0.id == item.id }
                  items.insert(item, at: 0)
                  persist()
              }

              func remove(_ item: SavedVideo) {
                  if let url = item.fileURL { try? FileManager.default.removeItem(at: url) }
                  if let name = item.thumbnailName {
                      try? FileManager.default.removeItem(at: thumbDir.appendingPathComponent(name))
                  }
                  items.removeAll { $0.id == item.id }
                  persist()
              }

              func makeDestinationURL(filename: String?) -> URL {
                  let safe = Self.sanitize(filename ?? "video_\(Int(Date().timeIntervalSince1970))")
                  return downloadsDir.appendingPathComponent(safe)
              }

              static func sanitize(_ s: String) -> String {
                  var out = s
                  let bad = CharacterSet(charactersIn: "/\\?%*|\"<>:")
                  out = out.components(separatedBy: bad).joined(separator: "_")
                  out = out.trimmingCharacters(in: .whitespacesAndNewlines)
                  if out.isEmpty { out = "video_\(Int(Date().timeIntervalSince1970))" }
                  return out
              }

              @discardableResult
              func saveThumbnail(remoteURL: String, for id: UUID) async -> String? {
                  guard let url = URL(string: remoteURL) else { return nil }
                  do {
                      var req = URLRequest(url: url)
                      req.timeoutInterval = 30
                      let (data, _) = try await URLSession.shared.data(for: req)
                      let name = "\(id.uuidString).jpg"
                      try data.write(to: thumbDir.appendingPathComponent(name), options: .atomic)
                      return name
                  } catch {
