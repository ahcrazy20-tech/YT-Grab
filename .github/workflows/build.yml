    - name: Build
      run: |
        cd VideoDownloaderPro
        
        xcodebuild -project VideoDownloaderPro.xcodeproj \
                   -scheme VideoDownloaderPro \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGN_IDENTITY="" \
                   build 2>&1
    
    - name: Package IPA
      run: |
        cd VideoDownloaderPro
        
        # Find built app
        APP_PATH=$(find . -name "*.app" -type d | head -n 1)
        echo "Found app: $APP_PATH"
        
        # Create Payload
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        
        # Sign with ldid
        if command -v ldid &> /dev/null; then
            find Payload -name "*.app" -exec ldid -S {} \; 2>/dev/null || true
        fi
        
        # Create IPA
        cd Payload
        zip -r ../VideoDownloaderPro.ipa *
        cd ..
        
        ls -lh VideoDownloaderPro.ipa
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoDownloaderPro-IPA
        path: VideoDownloaderPro.ipa

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        files: VideoDownloaderPro.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
