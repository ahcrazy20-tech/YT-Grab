              private var actionsRow: some View {
                  VStack(spacing: 10) {
                      if let url = item.fileURL {
                          ShareLink(item: url) {
                              Label("مشاركة / حفظ في الملفات", systemImage: "square.and.arrow.up")
                                  .frame(maxWidth: .infinity)
                          }
                          .buttonStyle(.borderedProminent)
                      }
                      HStack(spacing: 10) {
                          Button {
                              UIPasteboard.general.string = item.sourceURL
                          } label: {
                              Label("نسخ الرابط", systemImage: "link")
                                  .frame(maxWidth: .infinity)
                          }
                          .buttonStyle(.bordered)

                          Button(role: .destructive) {
                              showDelete = true
                          } label: {
                              Label("حذف", systemImage: "trash")
                                  .frame(maxWidth: .infinity)
                          }
                          .buttonStyle(.bordered)
                      }
                  }
              }
          }
          SWIFTEOF

          # ---------------- Views: settings ----------------
          gen Sources/Views/SettingsView.swift <<'SWIFTEOF'
          import SwiftUI

          struct SettingsView: View {
              @EnvironmentObject var settings: SettingsStore

              @State private var editorItem: InstanceConfig?
              @State private var editorIsNew = false

              private func enabledBinding(for id: UUID) -> Binding<Bool> {
                  Binding(
                      get: { settings.instances.first(where: { $0.id == id })?.enabled ?? false },
                      set: { newValue in
                          if let idx = settings.instances.firstIndex(where: { $0.id == id }) {
                              settings.instances[idx].enabled = newValue
                          }
                      }
                  )
              }

              var body: some View {
                  NavigationStack {
                      ZStack {
                          Background().ignoresSafeArea()
                          Form {
                              Section("جودة التحميل الافتراضية") {
                                  Picker("الجودة", selection: $settings.defaultQuality) {
                                      Text("أعلى جودة").tag("max")
                                      ForEach(["2160", "1440", "1080", "720", "480", "360", "240", "144"], id: \.self) { q in
                                          Text("\(q)p").tag(q)
                                      }
                                  }
                              }

                              Section("نوع التحميل الافتراضي") {
                                  Picker("النوع", selection: $settings.defaultKindRaw) {
                                      ForEach(DownloadKind.allCases) { k in
                                          Text(k.label).tag(k.rawValue)
                                      }
                                  }
                              }

                              Section("صيغة الصوت") {
                                  Picker("الصيغة", selection: $settings.defaultAudioFormat) {
                                      ForEach(["mp3", "opus", "wav", "ogg", "best"], id: \.self) { f in
                                          Text(f.uppercased()).tag(f)
                                      }
                                  }
                              }

                              Section("مثيلات الاستخراج (محركات التحميل)") {
                                  ForEach(settings.instances) { inst in
                                      HStack {
                                          VStack(alignment: .leading, spacing: 4) {
                                              Text(inst.name).font(.subheadline.weight(.semibold))
                                              Text(inst.url).font(.caption2).foregroundColor(.secondary)
                                          }
                                          Spacer()
                                          Toggle("", isOn: enabledBinding(for: inst.id)).labelsHidden()
                                          Button {
                                              editorItem = inst
                                              editorIsNew = false
                                          } label: {
                                              Image(systemName: "pencil")
                                          }
                                          .buttonStyle(.borderless)
                                      }
                                      .swipeActions {
                                          Button(role: .destructive) {
                                              settings.instances.removeAll { $0.id == inst.id }
                                          } label: { Label("حذف", systemImage: "trash") }
                                      }
                                  }
                                  Button {
                                      editorItem = InstanceConfig(name: "", url: "", path: "", apiKey: "", bearerToken: "", enabled: true)
                                      editorIsNew = true
                                  } label: {
                                      Label("إضافة مثيل جديد", systemImage: "plus.circle.fill")
                                  }
                              }

                              Section("أقوى طريقة: مثيلك الخاص (بلا حدود)") {
                                  Text("شغّل محرك cobalt على أي كمبيوتر أو سيرفر بأمر واحد:\n\ndocker run -d -p 9000:9000 --name cobalt ghcr.io/imputnet/cobalt:latest\n\nثم أضف عنوانه كمثيل جديد، مثلاً http://192.168.1.10:9000 — وستحصل على تحميل بلا حدود وبدون مفاتيح من كل المواقع المدعومة.")
                                      .font(.footnote)
                                      .foregroundColor(.secondary)
                                  Link("مستندات cobalt", destination: URL(string: "https://github.com/imputnet/cobalt")!)
                              }

                              Section {
                                  Button("استعادة المثيلات الافتراضية", role: .destructive) {
                                      settings.resetInstances()
                                  }
                              }
                          }
                          .scrollContentBackground(.hidden)
                      }
                      .navigationTitle("الإعدادات")
                      .sheet(item: $editorItem) { item in
                          InstanceEditorView(item: item, isNew: editorIsNew) { saved in
                              if editorIsNew {
                                  settings.instances.append(saved)
                              } else if let idx = settings.instances.firstIndex(where: { $0.id == saved.id }) {
                                  settings.instances[idx] = saved
                              }
                          }
                      }
                  }
              }
          }

          struct InstanceEditorView: View {
              @Environment(\.dismiss) private var dismiss
              let isNew: Bool
              let onSave: (InstanceConfig) -> Void

              @State private var id: UUID
              @State private var name: String
              @State private var url: String
              @State private var path: String
              @State private var apiKey: String
              @State private var bearerToken: String
              @State private var enabled: Bool

              init(item: InstanceConfig, isNew: Bool, onSave: @escaping (InstanceConfig) -> Void) {
                  self.isNew = isNew
                  self.onSave = onSave
                  _id = State(initialValue: item.id)
                  _name = State(initialValue: item.name)
                  _url = State(initialValue: item.url)
                  _path = State(initialValue: item.path)
                  _apiKey = State(initialValue: item.apiKey)
                  _bearerToken = State(initialValue: item.bearerToken)
                  _enabled = State(initialValue: item.enabled)
              }

              var body: some View {
                  NavigationStack {
                      Form {
                          Section("بيانات المثيل") {
                              TextField("الاسم", text: $name)
                              TextField("رابط الـ API", text: $url)
                                  .textInputAutocapitalization(.never)
                                  .keyboardType(.URL)
                                  .autocorrectionDisabled(true)
                              TextField("مسار الـ API (اختياري، افتراضي /)", text: $path)
                                  .textInputAutocapitalization(.never)
                                  .autocorrectionDisabled(true)
                              TextField("مفتاح API (اختياري)", text: $apiKey)
                                  .textInputAutocapitalization(.never)
                                  .autocorrectionDisabled(true)
                              TextField("Bearer Token (اختياري)", text: $bearerToken)
                                  .textInputAutocapitalization(.never)
                                  .autocorrectionDisabled(true)
                              Toggle("مفعّل", isOn: $enabled)
                          }
                          Section {
                              Text("غالبية المثيلات العامة تطلب مفتاح API الآن. أسرع حل بلا حدود: شغّل مثيلك الخاص بأمر Docker وأضف رابطه هنا.")
                                  .font(.footnote)
                                  .foregroundColor(.secondary)
                          }
                      }
                      .navigationTitle(isNew ? "مثيل جديد" : "تعديل المثيل")
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) { Button("إلغاء") { dismiss() } }
                          ToolbarItem(placement: .confirmationAction) {
                              Button("حفظ") {
                                  onSave(InstanceConfig(id: id, name: name, url: url, path: path,
                                                        apiKey: apiKey, bearerToken: bearerToken, enabled: enabled))
                                  dismiss()
                              }
                          }
                      }
                  }
              }
          }
          SWIFTEOF

          echo "==> اكتمل توليد كل الملفات:"
          find . -type f -not -path './.git/*' | sort

      # ----------------------------------------------------------------------
      # 2) تثبيت XcodeGen (أداة توليد مشروع Xcode من ملف YAML)
      # ----------------------------------------------------------------------
      - name: Install XcodeGen
        shell: bash
        run: |
          set -eo pipefail
          if curl -fL --retry 3 --retry-delay 2 -o /tmp/xcodegen.zip \
               "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"; then
            echo "==> فك الضغط..."
            rm -rf /tmp/xg && mkdir -p /tmp/xg
            unzip -qo /tmp/xcodegen.zip -d /tmp/xg
            cp /tmp/xg/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
            chmod +x /usr/local/bin/xcodegen
          else
            echo "==> فشل التحميل المباشر، نجرب Homebrew..."
            export HOMEBREW_NO_AUTO_UPDATE=1
            brew install xcodegen
          fi
          xcodegen --version

      # ----------------------------------------------------------------------
      # 3) توليد مشروع Xcode
      # ----------------------------------------------------------------------
      - name: Generate Xcode project
        shell: bash
        run: |
          set -eo pipefail
          xcodegen generate
          echo "==> تم توليد المشروع:"
          ls -la YTGrab.xcodeproj

      # ----------------------------------------------------------------------
      # 4) البناء بدون توقيع (جاهز لـ TrollStore)
      # ----------------------------------------------------------------------
      - name: Build unsigned app (iphoneos)
        shell: bash
        run: |
          set -eo pipefail
          xcodebuild \
            -project YTGrab.xcodeproj \
            -scheme YTGrab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ----------------------------------------------------------------------
      # 5) تحزيم .ipa و .tipa
      # ----------------------------------------------------------------------
      - name: Package IPA + TIPA
        shell: bash
        run: |
          set -eo pipefail
          APP="build/Build/Products/Release-iphoneos/YTGrab.app"
          if [ ! -d "$APP" ]; then
            echo "==> لم يتم العثور على التطبيق المبنى. المحتوى المتوفر:"
            find build -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry YTGrab.ipa Payload
          cp YTGrab.ipa YTGrab.tipa
          echo "==> الملفات الناتجة:"
          ls -la YTGrab.ipa YTGrab.tipa

      # ----------------------------------------------------------------------
      # 6) رفع الملفات كـ Artifact للتحميل
      # ----------------------------------------------------------------------
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YTGrab-TrollStore
          path: |
            YTGrab.ipa
            YTGrab.tipa
