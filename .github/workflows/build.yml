          import Foundation
          import Combine

          final class SettingsStore: ObservableObject {

              @Published var instances: [InstanceConfig] {
                  didSet { saveInstances() }
              }
              @Published var defaultQuality: String {
                  didSet { UserDefaults.standard.set(defaultQuality, forKey: "defaultQuality") }
              }
              @Published var defaultKindRaw: String {
                  didSet { UserDefaults.standard.set(defaultKindRaw, forKey: "defaultKindRaw") }
              }
              @Published var defaultAudioFormat: String {
                  didSet { UserDefaults.standard.set(defaultAudioFormat, forKey: "defaultAudioFormat") }
              }

              var defaultKind: DownloadKind {
                  DownloadKind(rawValue: defaultKindRaw) ?? .auto
              }

              static let defaultInstances: [InstanceConfig] = [
                  InstanceConfig(name: "Cobalt الرسمي",
                                 url: "https://api.cobalt.tools", path: "",
                                 apiKey: "", bearerToken: "", enabled: true),
                  InstanceConfig(name: "meowing.de",
                                 url: "https://cobalt-api.meowing.de", path: "",
                                 apiKey: "", bearerToken: "", enabled: true),
                  InstanceConfig(name: "canine.tools",
                                 url: "https://cobalt-backend.canine.tools", path: "",
                                 apiKey: "", bearerToken: "", enabled: true),
                  InstanceConfig(name: "3kh0",
                                 url: "https://capi.3kh0.net", path: "",
                                 apiKey: "", bearerToken: "", enabled: true),
                  InstanceConfig(name: "stuff.solutions (v7)",
                                 url: "https://downloadapi.stuff.solutions", path: "/api/json",
                                 apiKey: "", bearerToken: "", enabled: true),
                  InstanceConfig(name: "مثيلك الخاص (LAN)",
                                 url: "http://192.168.1.10:9000", path: "",
                                 apiKey: "", bearerToken: "", enabled: false)
              ]

              init() {
                  let d = UserDefaults.standard
                  if let data = d.data(forKey: "instances"),
                     let arr = try? JSONDecoder().decode([InstanceConfig].self, from: data) {
                      instances = arr
                  } else {
                      instances = Self.defaultInstances
                  }
                  defaultQuality = d.string(forKey: "defaultQuality") ?? "1080"
                  defaultKindRaw = d.string(forKey: "defaultKindRaw") ?? "auto"
                  defaultAudioFormat = d.string(forKey: "defaultAudioFormat") ?? "mp3"
              }

              private func saveInstances() {
                  if let data = try? JSONEncoder().encode(instances) {
                      UserDefaults.standard.set(data, forKey: "instances")
                  }
              }

              func resetInstances() {
                  instances = Self.defaultInstances
              }
          }
