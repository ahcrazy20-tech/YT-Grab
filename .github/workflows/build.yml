        		<key>NSAllowsArbitraryLoadsInWebContent</key>
        		<true/>
        	</dict>
        	<key>UIBackgroundModes</key>
        	<array>
        		<string>audio</string>
        		<string>fetch</string>
        		<string>processing</string>
        	</array>
        	<key>NSPhotoLibraryAddUsageDescription</key>
        	<string>نحتاج الوصول لحفظ الفيديوهات</string>
        	<key>NSPhotoLibraryUsageDescription</key>
        	<string>نحتاج الوصول لحفظ الفيديوهات</string>
        </dict>
        </plist>
        PLIST_EOF
    
    - name: Create AppDelegate.swift
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro/App/AppDelegate.swift << 'SWIFT_EOF'
        import UIKit
        import RealmSwift
        import SVProgressHUD

        @main
        class AppDelegate: UIResponder, UIApplicationDelegate {

            var window: UIWindow?

            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                
                configureRealm()
                configureAppearance()
                AdBlockManager.shared.loadBlockLists()
                
                return true
            }
            
            private func configureRealm() {
                let config = Realm.Configuration(
                    schemaVersion: 1,
                    migrationBlock: { migration, oldSchemaVersion in
                        if oldSchemaVersion < 1 {}
                    }
                )
                Realm.Configuration.defaultConfiguration = config
                _ = try? Realm()
            }
            
            private func configureAppearance() {
                SVProgressHUD.setDefaultStyle(.dark)
                SVProgressHUD.setDefaultMaskType(.black)
                
                let appearance = UINavigationBarAppearance()
                appearance.configureWithOpaqueBackground()
                UINavigationBar.appearance().standardAppearance = appearance
                UINavigationBar.appearance().scrollEdgeAppearance = appearance
            }

            func application(_ application: UIApplication, configurationForConnecting connectingSceneSession: UISceneSession, options: UIScene.ConnectionOptions) -> UISceneConfiguration {
                return UISceneConfiguration(name: "Default Configuration", sessionRole: connectingSceneSession.role)
            }
        }
        SWIFT_EOF
    
    - name: Create SceneDelegate.swift
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro/App/SceneDelegate.swift << 'SWIFT_EOF'
        import UIKit

        class SceneDelegate: UIResponder, UIWindowSceneDelegate {

            var window: UIWindow?

            func scene(_ scene: UIScene, willConnectTo session: UISceneSession, options connectionOptions: UIScene.ConnectionOptions) {
                guard let windowScene = (scene as? UIWindowScene) else { return }
                
                window = UIWindow(windowScene: windowScene)
                let tabBarController = MainTabBarController()
                window?.rootViewController = tabBarController
                window?.makeKeyAndVisible()
            }

            func sceneDidEnterBackground(_ scene: UIScene) {
                DownloadManager.shared.saveState()
            }
        }
        SWIFT_EOF
    
    - name: Create MainTabBarController.swift
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro/App/MainTabBarController.swift << 'SWIFT_EOF'
        import UIKit

        class MainTabBarController: UITabBarController {
            
            override func viewDidLoad() {
                super.viewDidLoad()
                setupViewControllers()
                setupAppearance()
            }
            
            private func setupViewControllers() {
                let browserVC = BrowserViewController()
                let browserNav = UINavigationController(rootViewController: browserVC)
                browserNav.tabBarItem = UITabBarItem(title: "متصفح", image: UIImage(systemName: "safari"), tag: 0)
                
                let downloadsVC = DownloadsViewController()
                let downloadsNav = UINavigationController(rootViewController: downloadsVC)
                downloadsNav.tabBarItem = UITabBarItem(title: "التحميلات", image: UIImage(systemName: "arrow.down.circle.fill"), tag: 1)
                
                let libraryVC = LibraryViewController()
                let libraryNav = UINavigationController(rootViewController: libraryVC)
                libraryNav.tabBarItem = UITabBarItem(title: "المكتبة", image: UIImage(systemName: "film.stack"), tag: 2)
                
                let settingsVC = SettingsViewController()
                let settingsNav = UINavigationController(rootViewController: settingsVC)
                settingsNav.tabBarItem = UITabBarItem(title: "الإعدادات", image: UIImage(systemName: "gear"), tag: 3)
                
                viewControllers = [browserNav, downloadsNav, libraryNav, settingsNav]
            }
            
            private func setupAppearance() {
                tabBar.tintColor = .systemBlue
                tabBar.backgroundColor = .systemBackground
                tabBar.isTranslucent = false
            }
        }
        SWIFT_EOF
    
    - name: Create BrowserViewController.swift (Main Browser)
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro/Browser/BrowserViewController.swift << 'SWIFT_EOF'
        import UIKit
        import WebKit
        import SnapKit
        import SVProgressHUD

        class BrowserViewController: UIViewController {
            
            private var webView: WKWebView!
            private var progressView: UIProgressView!
            private var urlTextField: UITextField!
            private var toolBar: UIToolbar!
            private var detectedVideos: [VideoInfo] = []
            private var observation: NSKeyValueObservation?
            
            override func viewDidLoad() {
                super.viewDidLoad()
                setupUI()
                setupWebView()
                setupToolbar()
                loadHomePage()
            }
            
            private func setupWebView() {
                let config = WKWebViewConfiguration()
                config.allowsInlineMediaPlayback = true
                config.allowsPictureInPictureMediaPlayback = true
                config.mediaTypesRequiringUserActionForPlayback = []
                config.preferences.javaScriptEnabled = true
                config.preferences.javaScriptCanOpenWindowsAutomatically = true
                
                if #available(iOS 14.0, *) {
                    config.defaultWebpagePreferences.allowsContentJavaScript = true
                }
                
                config.applicationNameForUserAgent = "Mozilla/5.0 (iPhone; CPU iPhone OS 16_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.4 Mobile/15E148 Safari/604.1"
                
                let contentController = WKUserContentController()
                
                let adBlockScript = WKUserScript(source: AdBlockManager.shared.getAdBlockScript(), injectionTime: .atDocumentStart, forMainFrameOnly: false)
                contentController.addUserScript(adBlockScript)
                
                let videoDetectorScript = WKUserScript(source: VideoDetector.getScript(), injectionTime: .atDocumentEnd, forMainFrameOnly: false)
                contentController.addUserScript(videoDetectorScript)
                
                contentController.add(self, name: "videoDetector")
                contentController.add(self, name: "consoleLog")
                
                config.userContentController = contentController
                
                webView = WKWebView(frame: .zero, configuration: config)
                webView.navigationDelegate = self
                webView.uiDelegate = self
                webView.allowsBackForwardNavigationGestures = true
                
                view.addSubview(webView)
                webView.snp.makeConstraints { make in
                    make.top.equalTo(progressView.snp.bottom)
                    make.leading.trailing.equalToSuperview()
                    make.bottom.equalTo(toolBar.snp.top)
                }
                
                observation = webView.observe(\.estimatedProgress, options: .new) { [weak self] webView, _ in
                    self?.progressView.progress = Float(webView.estimatedProgress)
                    self?.progressView.isHidden = webView.estimatedProgress >= 1.0
                }
            }
            
            private func setupUI() {
                view.backgroundColor = .systemBackground
                title = "متصفح"
                
                let containerView = UIView()
                containerView.backgroundColor = .systemBackground
                view.addSubview(containerView)
                
                containerView.snp.makeConstraints { make in
                    make.top.equalTo(view.safeAreaLayoutGuide)
                    make.leading.trailing.equalToSuperview()
                    make.height.equalTo(50)
                }
                
                let menuButton = UIButton(type: .system)
                menuButton.setImage(UIImage(systemName: "line.3.horizontal"), for: .normal)
                menuButton.addTarget(self, action: #selector(showMenu), for: .touchUpInside)
                containerView.addSubview(menuButton)
                
                menuButton.snp.makeConstraints { make in
                    make.leading.equalToSuperview().offset(12)
                    make.centerY.equalToSuperview()
                    make.width.height.equalTo(40)
                }
                
                urlTextField = UITextField()
                urlTextField.borderStyle = .roundedRect
                urlTextField.placeholder = "ابحث أو أدخل الرابط..."
                urlTextField.keyboardType = .webSearch
                urlTextField.autocapitalizationType = .none
                urlTextField.autocorrectionType = .no
                urlTextField.returnKeyType = .go
                urlTextField.clearButtonMode = .whileEditing
                urlTextField.delegate = self
                urlTextField.backgroundColor = .secondarySystemBackground
                urlTextField.layer.cornerRadius = 10
                containerView.addSubview(urlTextField)
                
                urlTextField.snp.makeConstraints { make in
                    make.leading.equalTo(menuButton.snp.trailing).offset(8)
                    make.trailing.equalToSuperview().offset(-12)
                    make.centerY.equalToSuperview()
                    make.height.equalTo(36)
                }
                
                progressView = UIProgressView(progressViewStyle: .bar)
                progressView.progressTintColor = .systemBlue
                progressView.isHidden = true
                view.addSubview(progressView)
                
                progressView.snp.makeConstraints { make in
                    make.top.equalTo(containerView.snp.bottom)
                    make.leading.trailing.equalToSuperview()
                    make.height.equalTo(3)
                }
            }
            
            private func setupToolbar() {
                toolBar = UIToolbar()
                toolBar.backgroundColor = .systemBackground
                view.addSubview(toolBar)
                
                toolBar.snp.makeConstraints { make in
                    make.leading.trailing.equalToSuperview()
                    make.bottom.equalTo(view.safeAreaLayoutGuide)
                    make.height.equalTo(44)
                }
                
                let backButton = UIBarButtonItem(image: UIImage(systemName: "chevron.left"), style: .plain, target: self, action: #selector(goBack))
                let forwardButton = UIBarButtonItem(image: UIImage(systemName: "chevron.right"), style: .plain, target: self, action: #selector(goForward))
                let refreshButton = UIBarButtonItem(image: UIImage(systemName: "arrow.clockwise"), style: .plain, target: self, action: #selector(reload))
                let flexSpace = UIBarButtonItem(barButtonSystemItem: .flexibleSpace, target: nil, action: nil)
                let downloadButton = UIBarButtonItem(image: UIImage(systemName: "arrow.down.circle.fill"), style: .plain, target: self, action: #selector(showDownloadOptions))
                let shareButton = UIBarButtonItem(image: UIImage(systemName: "square.and.arrow.up"), style: .plain, target: self, action: #selector(share))
                
                toolBar.items = [backButton, flexSpace, forwardButton, flexSpace, refreshButton, flexSpace, downloadButton, flexSpace, shareButton]
            }
            
            private func loadHomePage() {
                if let url = URL(string: "https://www.google.com") {
                    webView.load(URLRequest(url: url))
                }
            }
            
            @objc private func showMenu() {
                let alert = UIAlertController(title: "القائمة", message: nil, preferredStyle: .actionSheet)
                
                alert.addAction(UIAlertAction(title: "الصفحة الرئيسية", style: .default) { [weak self] _ in
                    self?.loadHomePage()
                })
                
                alert.addAction(UIAlertAction(title: "مسح البيانات", style: .destructive) { [weak self] _ in
                    self?.clearData()
                })
                
                alert.addAction(UIAlertAction(title: "وضع سطح المكتب", style: .default) { [weak self] _ in
                    self?.toggleDesktopMode()
                })
                
                alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                present(alert, animated: true)
            }
            
            @objc private func goBack() { webView.goBack() }
            @objc private func goForward() { webView.goForward() }
            @objc private func reload() { webView.reload() }
            
            @objc private func showDownloadOptions() {
                guard !detectedVideos.isEmpty else {
                    showAlert("لا توجد فيديوهات", message: "لم يتم اكتشاف أي فيديوهات في هذه الصفحة")
                    return
                }
                
                let alert = UIAlertController(title: "اختر فيديو (\(detectedVideos.count))", message: nil, preferredStyle: .actionSheet)
                
                let uniqueVideos = Array(Set(detectedVideos.map { $0.url })).compactMap { url in
                    detectedVideos.first(where: { $0.url == url })
                }
                
                for (index, video) in uniqueVideos.prefix(10).enumerated() {
                    let title = "\(index + 1). \(video.title) [\(video.type)]"
                    alert.addAction(UIAlertAction(title: title, style: .default) { [weak self] _ in
                        self?.downloadVideo(video)
                    })
                }
                
                alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                present(alert, animated: true)
            }
            
            @objc private func share() {
                guard let url = webView.url else { return }
                let activityVC = UIActivityViewController(activityItems: [url], applicationActivities: nil)
                present(activityVC, animated: true)
            }
            
            private func clearData() {
                WKWebsiteDataStore.default().fetchDataRecords(ofTypes: WKWebsiteDataStore.allWebsiteDataTypes()) { records in
                    WKWebsiteDataStore.default().removeData(ofTypes: WKWebsiteDataStore.allWebsiteDataTypes(), for: records) {
                        DispatchQueue.main.async {
                            SVProgressHUD.showSuccess(withStatus: "تم مسح البيانات")
                        }
                    }
                }
            }
            
            private func toggleDesktopMode() {
                let script = "var meta = document.createElement('meta'); meta.name = 'viewport'; meta.content = 'width=1024'; document.getElementsByTagName('head')[0].appendChild(meta);"
                webView.evaluateJavaScript(script)
                webView.reload()
            }
            
            private func downloadVideo(_ video: VideoInfo) {
                SVProgressHUD.show(withStatus: "جاري التحميل...")
                
                DownloadManager.shared.downloadVideo(video) { progress in
                    DispatchQueue.main.async {
                        SVProgressHUD.showProgress(Float(progress), status: "التحميل: \(Int(progress * 100))%")
                    }
                } completion: { result in
                    DispatchQueue.main.async {
                        SVProgressHUD.dismiss()
                        switch result {
                        case .success:
                            SVProgressHUD.showSuccess(withStatus: "تم التحميل بنجاح!")
                        case .failure(let error):
                            SVProgressHUD.showError(withStatus: "فشل: \(error.localizedDescription)")
                        }
                    }
                }
            }
            
            private func showAlert(_ title: String, message: String) {
                let alert = UIAlertController(title: title, message: message, preferredStyle: .alert)
                alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                present(alert, animated: true)
            }
            
            deinit {
                observation?.invalidate()
            }
        }

        extension BrowserViewController: WKScriptMessageHandler {
            func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                if message.name == "videoDetector", let dict = message.body as? [String: Any] {
                    let video = VideoInfo(
                        url: dict["url"] as? String ?? "",
                        title: dict["title"] as? String ?? "فيديو",
                        type: dict["type"] as? String ?? "unknown",
                        quality: dict["quality"] as? String,
                        duration: dict["duration"] as? Double
                    )
                    
                    if !video.url.isEmpty && !detectedVideos.contains(where: { $0.url == video.url }) {
                        detectedVideos.append(video)
                        print("🎥 تم اكتشاف: \(video.title)")
                    }
                }
            }
        }

        extension BrowserViewController: WKNavigationDelegate {
            func webView(_ webView: WKWebView, didStartProvisionalNavigation navigation: WKNavigation!) {
                detectedVideos.removeAll()
            }
            
            func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                urlTextField.text = webView.url?.absoluteString
            }
            
            func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                decisionHandler(.allow)
            }
        }

        extension BrowserViewController: WKUIDelegate {
            func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration, for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                if navigationAction.targetFrame == nil {
                    webView.load(navigationAction.request)
                }
                return nil
            }
        }

        extension BrowserViewController: UITextFieldDelegate {
            func textFieldShouldReturn(_ textField: UITextField) -> Bool {
                guard let text = textField.text, !text.isEmpty else { return false }
                
                var urlString = text
                if !text.hasPrefix("http://") && !text.hasPrefix("https://") {
                    if text.contains(".") {
                        urlString = "https://" + text
                    } else {
                        urlString = "https://www.google.com/search?q=" + (text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? text)
                    }
                }
                
                if let url = URL(string: urlString) {
                    webView.load(URLRequest(url: url))
                }
                
                textField.resignFirstResponder()
                return true
            }
        }
        SWIFT_EOF
    
    - name: Create VideoDetector.swift
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro/Browser/VideoDetector.swift << 'SWIFT_EOF'
        import Foundation

        class VideoDetector {
            static func getScript() -> String {
                return """
                (function() {
                    console.log('🎬 Video Detector Active');
                    
                    function detectHTML5Videos() {
                        document.querySelectorAll('video').forEach((video, index) => {
                            const sources = [video.src, video.currentSrc];
                            video.querySelectorAll('source').forEach(s => sources.push(s.src));
                            
                            sources.filter(Boolean).forEach(src => {
                                window.webkit.messageHandlers.videoDetector.postMessage({
                                    type: 'html5',
                                    url: src,
                                    title: document.title || 'فيديو ' + (index + 1),
                                    quality: video.videoHeight ? video.videoHeight + 'p' : 'unknown',
                                    duration: video.duration || 0
                                });
                            });
                        });
                    }
                    
                    const originalFetch = window.fetch;
                    window.fetch = function(...args) {
                        const url = typeof args[0] === 'string' ? args[0] : args[0].url;
                        if (url && (url.includes('.m3u8') || url.includes('.mpd') || url.includes('.mp4'))) {
                            window.webkit.messageHandlers.videoDetector.postMessage({
                                type: 'stream',
                                url: url,
                                title: document.title,
                                format: url.includes('.m3u8') ? 'HLS' : 'MP4'
                            });
                        }
                        return originalFetch.apply(this, args);
                    };
                    
                    const originalXHR = XMLHttpRequest.prototype.open;
                    XMLHttpRequest.prototype.open = function(method, url) {
                        if (typeof url === 'string' && (url.includes('.m3u8') || url.includes('.mp4'))) {
                            window.webkit.messageHandlers.videoDetector.postMessage({
                                type: 'xhr',
                                url: url,
                                title: document.title
                            });
                        }
                        return originalXHR.apply(this, arguments);
                    };
                    
                    const observer = new MutationObserver(detectHTML5Videos);
                    observer.observe(document.body || document.documentElement, {childList: true, subtree: true});
                    
                    setTimeout(detectHTML5Videos, 1000);
                    setTimeout(detectHTML5Videos, 3000);
                })();
                """
            }
        }
