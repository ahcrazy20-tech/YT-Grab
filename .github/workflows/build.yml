          import Foundation

          /// تحميل الملفات مع شريط تقدّم حقيقي
          final class FileDownloader: NSObject, URLSessionDownloadDelegate {

              private var onProgress: ((Double) -> Void)?
              private var continuation: CheckedContinuation<URL, Error>?
              private var targetURL: URL?
              private var finished = false

              private lazy var session: URLSession = URLSession(configuration: .default,
                                                                 delegate: self,
                                                                 delegateQueue: .main)

              func download(url: URL,
                            to destination: URL,
                            progress: @escaping (Double) -> Void) async throws -> URL {
                  finished = false
                  onProgress = progress
                  targetURL = destination

                  return try await withCheckedThrowingContinuation { cont in
                      self.continuation = cont
                      var req = URLRequest(url: url)
                      req.timeoutInterval = 900
                      req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 16_4 like Mac OS X) AppleWebKit/605.1.15",
                                   forHTTPHeaderField: "User-Agent")
                      let task = session.downloadTask(with: req)
                      task.resume()
                  }
              }

              func urlSession(_ session: URLSession,
                              downloadTask: URLSessionDownloadTask,
                              didWriteData bytesWritten: Int64,
                              totalBytesWritten: Int64,
                              totalBytesExpectedToWrite: Int64) {
                  guard totalBytesExpectedToWrite > 0 else { return }
                  onProgress?(Double(totalBytesWritten) / Double(totalBytesExpectedToWrite))
              }

              func urlSession(_ session: URLSession,
                              downloadTask: URLSessionDownloadTask,
                              didFinishDownloadingTo location: URL) {
                  guard !finished else { return }
                  do {
                      guard let target = targetURL else { throw EngineError.server("لا يوجد مسار حفظ") }
                      try? FileManager.default.removeItem(at: target)
                      try FileManager.default.createDirectory(at: target.deletingLastPathComponent(),
                                                             withIntermediateDirectories: true)
                      try FileManager.default.moveItem(at: location, to: target)
                      finished = true
                      continuation?.resume(returning: target)
                      continuation = nil
                  } catch {
                      finished = true
                      continuation?.resume(throwing: error)
                      continuation = nil
                  }
              }

              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let error = error, !finished else { return }
                  finished = true
                  continuation?.resume(throwing: error)
                  continuation = nil
              }
          }
