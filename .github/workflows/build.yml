    - name: Install CocoaPods Dependencies
      run: |
        cd VideoDownloaderPro
        pod install --repo-update
    
    - name: Build Project
      run: |
        cd VideoDownloaderPro
        xcodebuild -workspace VideoDownloaderPro.xcworkspace \
                   -scheme VideoDownloaderPro \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   clean build
    
    - name: Create IPA
      run: |
        cd VideoDownloaderPro
        
        # إنشاء مجلد Payload
        mkdir -p Payload
        
        # نسخ التطبيق
        cp -r build/Build/Products/Release-iphoneos/VideoDownloaderPro.app Payload/
        
        # التوقيع باستخدام ldid
        find Payload/VideoDownloaderPro.app -type f -name "*.dylib" -exec ldid -S {} \;
        ldid -S Payload/VideoDownloaderPro.app/VideoDownloaderPro
        
        # إنشاء IPA
        zip -r ../VideoDownloaderPro.ipa Payload
        
        cd ..
        ls -lh VideoDownloaderPro.ipa
    
