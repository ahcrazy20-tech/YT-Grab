    - name: Create AdBlockManager.swift (Enhanced)
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro/AdBlocker/AdBlockManager.swift << 'SWIFT_EOF'
        import Foundation

        class AdBlockManager {
            static let shared = AdBlockManager()
            private init() {}
            
            func loadBlockLists() {
                print("🛡️ AdBlocker Loaded")
            }
            
            func getAdBlockScript() -> String {
                return """
                (function() {
                    'use strict';
                    console.log('🛡️ AdBlocker Activated');
                    
                    const blockedDomains = [
                        'googlesyndication.com','googleadservices.com','doubleclick.net',
                        'google-analytics.com','googletagmanager.com','facebook.com/tr',
                        'connect.facebook.net','adnxs.com','advertising.com',
                        'criteo.com','outbrain.com','taboola.com','popads.net',
                        'propellerads.com','imasdk.googleapis.com','pubads.g.doubleclick.net'
                    ];
                    
                    const originalFetch = window.fetch;
                    window.fetch = function(...args) {
                        const url = typeof args[0] === 'string' ? args[0] : args[0].url;
                        if (blockedDomains.some(d => url.includes(d))) {
                            console.log('🚫 Blocked:', url);
                            return Promise.reject(new Error('Blocked'));
                        }
                        return originalFetch.apply(this, args);
                    };
                    
                    const originalXHR = XMLHttpRequest.prototype.open;
                    XMLHttpRequest.prototype.open = function(method, url) {
                        if (blockedDomains.some(d => url.includes(d))) {
                            console.log('🚫 Blocked XHR:', url);
                            return;
                        }
                        return originalXHR.apply(this, arguments);
                    };
                    
                    function removeAds() {
                        const selectors = [
                            '[id*="ad"]','[class*="ad"]','[id*="banner"]',
                            '[class*="banner"]','iframe[src*="doubleclick"]',
                            '.ad-container','.advertisement'
                        ];
                        
                        selectors.forEach(sel => {
                            document.querySelectorAll(sel).forEach(el => {
                                if (el.offsetHeight < 250) el.remove();
                            });
                        });
                    }
                    
                    window.open = () => null;
                    
                    setInterval(removeAds, 2000);
                    const observer = new MutationObserver(removeAds);
                    observer.observe(document.body || document.documentElement, {childList: true, subtree: true});
                })();
                """
            }
        }
        SWIFT_EOF
    
    - name: Create DownloadManager.swift
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro/Downloader/DownloadManager.swift << 'SWIFT_EOF'
        import Foundation
        import Alamofire
        import RealmSwift

        class DownloadManager {
            static let shared = DownloadManager()
            private init() {}
            
            private var activeDownloads: [String: DownloadRequest] = [:]
            
            func downloadVideo(_ video: VideoInfo, progress: @escaping (Double) -> Void, completion: @escaping (Result<URL, Error>) -> Void) {
                
                let fileName = "\(UUID().uuidString).mp4"
                let destination: DownloadRequest.Destination = { _, _ in
                    let documentsURL = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                    let fileURL = documentsURL.appendingPathComponent(fileName)
                    return (fileURL, [.removePreviousFile, .createIntermediateDirectories])
                }
                
                let headers: HTTPHeaders = [
                    "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 16_4 like Mac OS X) AppleWebKit/605.1.15",
                    "Accept": "*/*"
                ]
                
                let request = AF.download(video.url, headers: headers, to: destination)
                    .downloadProgress { prog in
                        progress(prog.fractionCompleted)
                    }
                    .response { [weak self] response in
                        self?.activeDownloads.removeValue(forKey: video.url)
                        
                        switch response.result {
                        case .success(let url):
                            guard let url = url else {
                                completion(.failure(NSError(domain: "", code: -1)))
                                return
                            }
                            self?.saveToDatabase(video: video, localURL: url)
                            completion(.success(url))
                        case .failure(let error):
                            completion(.failure(error))
                        }
                    }
                
                activeDownloads[video.url] = request
            }
            
            private func saveToDatabase(video: VideoInfo, localURL: URL) {
                let realm = try! Realm()
                let videoObject = VideoObject()
                videoObject.id = UUID().uuidString
                videoObject.title = video.title
                videoObject.originalURL = video.url
                videoObject.localPath = localURL.path
                videoObject.downloadDate = Date()
                videoObject.fileSize = getFileSize(localURL)
                
                try! realm.write {
                    realm.add(videoObject)
                }
            }
            
            private func getFileSize(_ url: URL) -> Int64 {
                (try? FileManager.default.attributesOfItem(atPath: url.path)[.size] as? Int64) ?? 0
            }
            
            func saveState() {}
            
            func cancelDownload(_ url: String) {
                activeDownloads[url]?.cancel()
                activeDownloads.removeValue(forKey: url)
            }
        }
        SWIFT_EOF
    
