name: Build Video Downloader Pro for TrollStore

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '14.3.1'
    
    - name: Install Build Tools
      run: |
        brew install ldid
        sudo gem install cocoapods
        brew install zip
    
    - name: Create Complete Project Structure
      run: |
        # إنشاء هيكل المشروع
        mkdir -p VideoDownloaderPro/VideoDownloaderPro.xcodeproj
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/App
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/Browser
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/Downloader
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/Player
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/Library
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/Models
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/AdBlocker
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/Settings
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/Helpers
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/Resources
        mkdir -p VideoDownloaderPro/VideoDownloaderPro/Assets.xcassets/AppIcon.appiconset
    
    - name: Create project.pbxproj
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro.xcodeproj/project.pbxproj << 'PBXPROJ_EOF'
        // !$*UTF8*$!
        {
        	archiveVersion = 1;
        	classes = {
        	};
        	objectVersion = 56;
        	objects = {
        		001 = {isa = PBXBuildFile; fileRef = 002; };
        		002 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };
        		003 = {isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
        		004 = {isa = PBXGroup; children = (002,); path = VideoDownloaderPro; sourceTree = "<group>"; };
        		005 = {isa = PBXNativeTarget; buildConfigurationList = 006; buildPhases = (003,); buildRules = (); dependencies = (); name = VideoDownloaderPro; productName = VideoDownloaderPro; productReference = 007; productType = "com.apple.product-type.application"; };
        		006 = {isa = XCConfigurationList; buildConfigurations = (008,009,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
        		007 = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = VideoDownloaderPro.app; sourceTree = BUILT_PRODUCTS_DIR; };
        		008 = {isa = XCBuildConfiguration; buildSettings = {PRODUCT_NAME = "$(TARGET_NAME)"; SWIFT_VERSION = 5.0; IPHONEOS_DEPLOYMENT_TARGET = 16.0; PRODUCT_BUNDLE_IDENTIFIER = "com.videodownloader.pro"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO; }; name = Debug; };
        		009 = {isa = XCBuildConfiguration; buildSettings = {PRODUCT_NAME = "$(TARGET_NAME)"; SWIFT_VERSION = 5.0; IPHONEOS_DEPLOYMENT_TARGET = 16.0; PRODUCT_BUNDLE_IDENTIFIER = "com.videodownloader.pro"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO; }; name = Release; };
        		010 = {isa = PBXProject; attributes = {LastUpgradeCheck = 1430; }; buildConfigurationList = 011; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, ar,); mainGroup = 004; productRefGroup = 004; projectDirPath = ""; projectRoot = ""; targets = (005,); };
        		011 = {isa = XCConfigurationList; buildConfigurations = (008,009,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
        	};
        	rootObject = 010;
        }
        PBXPROJ_EOF
    
    - name: Create Podfile
      run: |
        cat > VideoDownloaderPro/Podfile << 'PODFILE_EOF'
        platform :ios, '16.0'
        use_frameworks!
        inhibit_all_warnings!

        target 'VideoDownloaderPro' do
          # Networking
          pod 'Alamofire', '~> 5.8'
          
          # Video Player
          pod 'MobileVLCKit', '~> 3.5'
          
          # Database
          pod 'RealmSwift', '~> 10.45'
          
          # UI
          pod 'SnapKit', '~> 5.6'
          pod 'SVProgressHUD', '~> 2.2'
          pod 'Kingfisher', '~> 7.10'
          
          # Utilities
          pod 'SwiftyJSON', '~> 5.0'
        end

        post_install do |installer|
          installer.pods_project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
            end
          end
        end
        PODFILE_EOF
    
    - name: Create Info.plist
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro/Info.plist << 'PLIST_EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
        	<key>CFBundleDevelopmentRegion</key>
        	<string>ar</string>
        	<key>CFBundleDisplayName</key>
        	<string>Video Pro</string>
        	<key>CFBundleExecutable</key>
        	<string>$(EXECUTABLE_NAME)</string>
        	<key>CFBundleIdentifier</key>
        	<string>com.videodownloader.pro</string>
        	<key>CFBundleInfoDictionaryVersion</key>
        	<string>6.0</string>
        	<key>CFBundleName</key>
        	<string>$(PRODUCT_NAME)</string>
        	<key>CFBundlePackageType</key>
        	<string>APPL</string>
        	<key>CFBundleShortVersionString</key>
        	<string>1.0</string>
        	<key>CFBundleVersion</key>
        	<string>1</string>
        	<key>LSRequiresIPhoneOS</key>
        	<true/>
        	<key>UIApplicationSceneManifest</key>
        	<dict>
        		<key>UIApplicationSupportsMultipleScenes</key>
        		<false/>
        		<key>UISceneConfigurations</key>
        		<dict>
        			<key>UIWindowSceneSessionRoleApplication</key>
        			<array>
        				<dict>
        					<key>UISceneConfigurationName</key>
        					<string>Default Configuration</string>
        					<key>UISceneDelegateClassName</key>
        					<string>$(PRODUCT_MODULE_NAME).SceneDelegate</string>
        				</dict>
        			</array>
        		</dict>
        	</dict>
        	<key>UIApplicationSupportsIndirectInputEvents</key>
        	<true/>
        	<key>UILaunchStoryboardName</key>
        	<string>LaunchScreen</string>
        	<key>UIRequiredDeviceCapabilities</key>
        	<array>
        		<string>armv7</string>
        	</array>
        	<key>UISupportedInterfaceOrientations</key>
        	<array>
        		<string>UIInterfaceOrientationPortrait</string>
        		<string>UIInterfaceOrientationLandscapeLeft</string>
        		<string>UIInterfaceOrientationLandscapeRight</string>
        	</array>
        	<key>UIFileSharingEnabled</key>
        	<true/>
        	<key>LSSupportsOpeningDocumentsInPlace</key>
