          /// معلومات الفيديو (العنوان + المصغّر + الموقع) عبر oEmbed
          struct VideoMeta {
              var title: String?
              var thumbnailURL: String?
              var service: String

              static let empty = VideoMeta(title: nil, thumbnailURL: nil, service: "")
          }

          struct OEmbedResponse: Codable {
              var title: String?
              var thumbnail_url: String?
              var provider_name: String?
              var author_name: String?
          }

          enum MetadataFetcher {

              private static let unreserved = CharacterSet(charactersIn:
                  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~")

              static func serviceName(for url: String) -> String {
                  let host = hostOf(url) ?? ""
                  if host.contains("youtu") { return "YouTube" }
                  if host.contains("tiktok") { return "TikTok" }
                  if host.contains("twitter") || host.contains("x.com") { return "X / Twitter" }
                  if host.contains("instagram") { return "Instagram" }
                  if host.contains("reddit") { return "Reddit" }
                  if host.contains("vimeo") { return "Vimeo" }
                  if host.contains("soundcloud") { return "SoundCloud" }
                  if host.contains("facebook") || host.contains("fb.com") { return "Facebook" }
                  if host.contains("twitch") { return "Twitch" }
                  if host.contains("tumblr") { return "Tumblr" }
                  if host.contains("bilibili") { return "Bilibili" }
                  if host.contains("pinterest") { return "Pinterest" }
                  return host
              }

              static func hostOf(_ urlString: String) -> String? {
                  guard let url = URL(string: urlString), let host = url.host else { return nil }
                  return host
              }

              static func fetch(for urlString: String) async -> VideoMeta {
                  let service = serviceName(for: urlString)
                  guard URL(string: urlString) != nil else {
                      return VideoMeta(title: nil, thumbnailURL: nil, service: service)
                  }

                  var oembed: String?
                  switch service {
                  case "YouTube":
                      oembed = "https://www.youtube.com/oembed?url=\(esc(urlString))&format=json"
                  case "TikTok":
                      oembed = "https://www.tiktok.com/oembed?url=\(esc(urlString))"
                  case "Vimeo":
                      oembed = "https://vimeo.com/api/oembed.json?url=\(esc(urlString))"
                  default:
                      oembed = nil
                  }

                  guard let endpoint = oembed, let u = URL(string: endpoint) else {
                      return VideoMeta(title: nil, thumbnailURL: nil, service: service)
                  }

                  var req = URLRequest(url: u)
                  req.timeoutInterval = 20
                  if let (data, _) = try? await URLSession.shared.data(for: req),
                     let decoded = try? JSONDecoder().decode(OEmbedResponse.self, from: data) {
                      return VideoMeta(title: decoded.title,
                                       thumbnailURL: decoded.thumbnail_url,
                                       service: service)
                  }
                  return VideoMeta(title: nil, thumbnailURL: nil, service: service)
              }

              private static func esc(_ s: String) -> String {
                  s.addingPercentEncoding(withAllowedCharacters: unreserved) ?? s
              }
          }
