          // ============================================================
          //  مدير التحميل المشترك — يدعم إعادة التسمية + تحويل HLS
          // ============================================================

          final class DownloadManager: ObservableObject {
              @Published var progress: Double = 0
              @Published var isDownloading = false

              private let fileDownloader = FileDownloader()

              @discardableResult
              func download(option: StreamOption,
                            title: String,
                            service: String,
                            thumbnailURL: String?,
                            pageURL: String,
                            customName: String?,
                            library: LibraryStore) async throws -> SavedVideo {
