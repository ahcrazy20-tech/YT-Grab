    - name: Create LibraryViewController.swift
      run: |
        cat > VideoDownloaderPro/VideoDownloaderPro/Library/LibraryViewController.swift << 'SWIFT_EOF'
        import UIKit
        import RealmSwift
        import SnapKit

        class LibraryViewController: UIViewController {
            
            private var tableView: UITableView!
            private var videos: Results<VideoObject>!
            private var notificationToken: NotificationToken?
            
            override func viewDidLoad() {
                super.viewDidLoad()
                title = "المكتبة"
                view.backgroundColor = .systemBackground
                setupTableView()
                loadVideos()
            }
            
            private func setupTableView() {
                tableView = UITableView()
                tableView.delegate = self
                tableView.dataSource = self
                tableView.register(VideoCell.self, forCellReuseIdentifier: "VideoCell")
                tableView.rowHeight = 100
                view.addSubview(tableView)
                
                tableView.snp.makeConstraints { make in
                    make.edges.equalToSuperview()
                }
            }
            
            private func loadVideos() {
                let realm = try! Realm()
                videos = realm.objects(VideoObject.self).sorted(byKeyPath: "downloadDate", ascending: false)
                
                notificationToken = videos.observe { [weak self] _ in
                    self?.tableView.reloadData()
                }
            }
            
            deinit {
                notificationToken?.invalidate()
            }
        }

        extension LibraryViewController: UITableViewDelegate, UITableViewDataSource {
            func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int {
                return videos?.count ?? 0
            }
            
            func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                let cell = tableView.dequeueReusableCell(withIdentifier: "VideoCell", for: indexPath) as! VideoCell
                if let video = videos?[indexPath.row] {
                    cell.configure(with: video)
                }
                return cell
            }
            
            func tableView(_ tableView: UITableView, didSelectRowAt indexPath: IndexPath) {
                tableView.deselectRow(at: indexPath, animated: true)
                guard let video = videos?[indexPath.row] else { return }
                
                let playerVC = VideoPlayerViewController()
                playerVC.videoURL = URL(fileURLWithPath: video.localPath)
                playerVC.modalPresentationStyle = .fullScreen
                present(playerVC, animated: true)
            }
            
            func tableView(_ tableView: UITableView, commit editingStyle: UITableViewCell.EditingStyle, forRowAt indexPath: IndexPath) {
                if editingStyle == .delete {
                    guard let video = videos?[indexPath.row] else { return }
                    
                    try? FileManager.default.removeItem(atPath: video.localPath)
                    
                    let realm = try! Realm()
                    try! realm.write {
                        realm.delete(video)
                    }
                }
            }
        }

        class VideoCell: UITableViewCell {
            private let titleLabel = UILabel()
            private let dateLabel = UILabel()
            private let sizeLabel = UILabel()
            
            override init(style: UITableViewCell.CellStyle, reuseIdentifier: String?) {
                super.init(style: style, reuseIdentifier: reuseIdentifier)
                setupUI()
            }
            
            required init?(coder: NSCoder) {
                fatalError("init(coder:) has not been implemented")
            }
            
            private func setupUI() {
                titleLabel.font = .boldSystemFont(ofSize: 16)
                dateLabel.font = .systemFont(ofSize: 12)
                dateLabel.textColor = .secondaryLabel
                sizeLabel.font = .systemFont(ofSize: 12)
                sizeLabel.textColor = .secondaryLabel
                
                contentView.addSubview(titleLabel)
                contentView.addSubview(dateLabel)
                contentView.addSubview(sizeLabel)
                
                titleLabel.snp.makeConstraints { make in
                    make.top.equalToSuperview().offset(12)
                    make.leading.trailing.equalToSuperview().inset(16)
                }
                
                dateLabel.snp.makeConstraints { make in
                    make.top.equalTo(titleLabel.snp.bottom).offset(8)
                    make.leading.equalToSuperview().offset(16)
                }
                
                sizeLabel.snp.makeConstraints { make in
                    make.top.equalTo(dateLabel.snp.bottom).offset(4)
                    make.leading.equalToSuperview().offset(16)
                    make.bottom.equalToSuperview().offset(-12)
                }
            }
            
            func configure(with video: VideoObject) {
                titleLabel.text = video.title
                
                let formatter = DateFormatter()
                formatter.dateStyle = .short
                formatter.timeStyle = .short
                dateLabel.text = formatter.string(from: video.downloadDate)
                
                let sizeInMB = Double(video.fileSize) / 1024.0 / 1024.0
                sizeLabel.text = String(format: "%.2f MB", sizeInMB)
            }
        }
        SWIFT_EOF
    
