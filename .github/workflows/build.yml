name: Build Video Downloader Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      run: |
        sudo xcode-select -switch /Applications/Xcode_15.0.app
        xcodebuild -version
    
    - name: Install Tools
      run: |
        brew install ldid
        brew install cocoapods
    
    - name: Create Full Project
      run: |
        # Create project structure
        mkdir -p VideoDownloaderPro/VideoDownloaderPro
        
        # Create Info.plist
        cat > VideoDownloaderPro/VideoDownloaderPro/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>VideoDownloaderPro</string>
            <key>CFBundleIdentifier</key>
            <string>com.video.downloader.pro</string>
            <key>CFBundleName</key>
            <string>Video Pro</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIApplicationSceneManifest</key>
            <dict>
                <key>UIApplicationSupportsMultipleScenes</key>
                <false/>
            </dict>
            <key>NSAppTransportSecurity</key>
            <dict>
                <key>NSAllowsArbitraryLoads</key>
                <true/>
            </dict>
        </dict>
        </plist>
        EOF
        
        # Create main.swift
        cat > VideoDownloaderPro/VideoDownloaderPro/main.swift << 'EOF'
        import UIKit
        import WebKit

        @main
        class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                window = UIWindow(frame: UIScreen.main.bounds)
                window?.rootViewController = TabBarController()
                window?.makeKeyAndVisible()
                return true
            }
        }

        class TabBarController: UITabBarController {
            override func viewDidLoad() {
                super.viewDidLoad()
                
                let browser = UINavigationController(rootViewController: BrowserViewController())
                browser.tabBarItem = UITabBarItem(title: "متصفح", image: UIImage(systemName: "safari"), tag: 0)
                
                let library = UINavigationController(rootViewController: LibraryViewController())
                library.tabBarItem = UITabBarItem(title: "المكتبة", image: UIImage(systemName: "film"), tag: 1)
                
                viewControllers = [browser, library]
            }
        }

        class BrowserViewController: UIViewController, WKNavigationDelegate, WKUIDelegate, UITextFieldDelegate {
            private var webView: WKWebView!
            private var urlField: UITextField!
            private var detectedVideos: [(url: String, title: String)] = []
            
            override func viewDidLoad() {
                super.viewDidLoad()
                title = "متصفح"
                view.backgroundColor = .systemBackground
                
                // URL Field
                urlField = UITextField(frame: CGRect(x: 20, y: 100, width: view.frame.width - 40, height: 44))
                urlField.borderStyle = .roundedRect
                urlField.placeholder = "أدخل الرابط..."
                urlField.delegate = self
                urlField.autocapitalizationType = .none
                urlField.keyboardType = .webSearch
                view.addSubview(urlField)
                
                // WebView Setup
                let config = WKWebViewConfiguration()
                config.allowsInlineMediaPlayback = true
                config.mediaTypesRequiringUserActionForPlayback = []
                
                let contentController = WKUserContentController()
                
                // Ad Blocker Script
                let adBlockScript = """
                (function() {
                    const blockedDomains = ['googlesyndication.com','doubleclick.net','ads','banner'];
                    const originalFetch = window.fetch;
                    window.fetch = function(...args) {
                        const url = typeof args[0] === 'string' ? args[0] : args[0].url;
                        if (blockedDomains.some(d => url.includes(d))) return Promise.reject();
                        return originalFetch.apply(this, args);
                    };
                    
                    function removeAds() {
                        document.querySelectorAll('[id*="ad"],[class*="ad"]').forEach(el => {
                            if (el.offsetHeight < 200) el.remove();
                        });
                    }
                    setInterval(removeAds, 2000);
                })();
                """
                contentController.addUserScript(WKUserScript(source: adBlockScript, injectionTime: .atDocumentStart, forMainFrameOnly: false))
                
                // Video Detector Script
                let videoScript = """
                (function() {
                    function detectVideos() {
                        document.querySelectorAll('video').forEach((v, i) => {
                            if (v.src || v.currentSrc) {
                                console.log('VIDEO:', v.src || v.currentSrc);
                            }
                        });
                    }
                    
                    const originalFetch = window.fetch;
                    window.fetch = function(...args) {
                        const url = typeof args[0] === 'string' ? args[0] : args[0].url;
                        if (url.includes('.m3u8') || url.includes('.mp4')) {
                            console.log('STREAM:', url);
                        }
                        return originalFetch.apply(this, args);
                    };
                    
                    setInterval(detectVideos, 3000);
                })();
                """
                contentController.addUserScript(WKUserScript(source: videoScript, injectionTime: .atDocumentEnd, forMainFrameOnly: false))
                
                config.userContentController = contentController
                
                webView = WKWebView(frame: CGRect(x: 0, y: 160, width: view.frame.width, height: view.frame.height - 260), configuration: config)
                webView.navigationDelegate = self
                webView.uiDelegate = self
                webView.allowsBackForwardNavigationGestures = true
                view.addSubview(webView)
                
                // Toolbar
                let toolbar = UIToolbar(frame: CGRect(x: 0, y: view.frame.height - 100, width: view.frame.width, height: 44))
                let back = UIBarButtonItem(image: UIImage(systemName: "chevron.left"), style: .plain, target: self, action: #selector(goBack))
                let forward = UIBarButtonItem(image: UIImage(systemName: "chevron.right"), style: .plain, target: self, action: #selector(goForward))
                let refresh = UIBarButtonItem(image: UIImage(systemName: "arrow.clockwise"), style: .plain, target: self, action: #selector(reload))
                let space = UIBarButtonItem(systemItem: .flexibleSpace)
                let download = UIBarButtonItem(image: UIImage(systemName: "arrow.down.circle.fill"), style: .plain, target: self, action: #selector(showDownloads))
                toolbar.items = [back, space, forward, space, refresh, space, download]
                view.addSubview(toolbar)
                
                // Load Google
                if let url = URL(string: "https://www.google.com") {
                    webView.load(URLRequest(url: url))
                }
            }
            
            @objc func goBack() { webView.goBack() }
            @objc func goForward() { webView.goForward() }
            @objc func reload() { webView.reload() }
            
            @objc func showDownloads() {
                let alert = UIAlertController(title: "تحميل فيديو", message: "أدخل رابط الفيديو", preferredStyle: .alert)
                alert.addTextField { field in
                    field.placeholder = "https://example.com/video.mp4"
                    field.text = self.webView.url?.absoluteString
                }
                alert.addAction(UIAlertAction(title: "تحميل", style: .default) { _ in
                    if let urlText = alert.textFields?.first?.text, let url = URL(string: urlText) {
                        self.downloadVideo(url)
                    }
                })
                alert.addAction(UIAlertAction(title: "إلغاء", style: .cancel))
                present(alert, animated: true)
            }
            
            func downloadVideo(_ url: URL) {
                let session = URLSession.shared
                let task = session.downloadTask(with: url) { localURL, response, error in
                    guard let localURL = localURL else { return }
                    
                    let documentsPath = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                    let destinationURL = documentsPath.appendingPathComponent("video_\(Int(Date().timeIntervalSince1970)).mp4")
                    
                    try? FileManager.default.moveItem(at: localURL, to: destinationURL)
                    
                    DispatchQueue.main.async {
                        let alert = UIAlertController(title: "تم التحميل", message: "تم حفظ الفيديو بنجاح", preferredStyle: .alert)
                        alert.addAction(UIAlertAction(title: "حسناً", style: .default))
                        self.present(alert, animated: true)
                    }
                }
                task.resume()
            }
            
            func textFieldShouldReturn(_ textField: UITextField) -> Bool {
                guard let text = textField.text, !text.isEmpty else { return false }
                var urlString = text
                if !text.hasPrefix("http") {
                    urlString = text.contains(".") ? "https://" + text : "https://www.google.com/search?q=" + text
                }
                if let url = URL(string: urlString) {
                    webView.load(URLRequest(url: url))
                }
                textField.resignFirstResponder()
                return true
            }
            
            func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                urlField.text = webView.url?.absoluteString
            }
        }

        class LibraryViewController: UIViewController, UITableViewDelegate, UITableViewDataSource {
            private var tableView: UITableView!
            private var videos: [URL] = []
            
            override func viewDidLoad() {
                super.viewDidLoad()
                title = "المكتبة"
                view.backgroundColor = .systemBackground
                
                tableView = UITableView(frame: view.bounds)
                tableView.delegate = self
                tableView.dataSource = self
                tableView.register(UITableViewCell.self, forCellReuseIdentifier: "cell")
                view.addSubview(tableView)
                
                loadVideos()
            }
            
            override func viewWillAppear(_ animated: Bool) {
                super.viewWillAppear(animated)
                loadVideos()
            }
            
            func loadVideos() {
                let documentsPath = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                videos = (try? FileManager.default.contentsOfDirectory(at: documentsPath, includingPropertiesForKeys: nil))?.filter { $0.pathExtension == "mp4" } ?? []
                tableView.reloadData()
            }
            
            func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int {
                return videos.count
            }
            
            func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                let cell = tableView.dequeueReusableCell(withIdentifier: "cell", for: indexPath)
                cell.textLabel?.text = videos[indexPath.row].lastPathComponent
                return cell
            }
            
            func tableView(_ tableView: UITableView, didSelectRowAt indexPath: IndexPath) {
                tableView.deselectRow(at: indexPath, animated: true)
                let playerVC = VideoPlayerViewController()
                playerVC.videoURL = videos[indexPath.row]
                playerVC.modalPresentationStyle = .fullScreen
                present(playerVC, animated: true)
            }
            
            func tableView(_ tableView: UITableView, commit editingStyle: UITableViewCell.EditingStyle, forRowAt indexPath: IndexPath) {
                if editingStyle == .delete {
                    try? FileManager.default.removeItem(at: videos[indexPath.row])
                    videos.remove(at: indexPath.row)
                    tableView.deleteRows(at: [indexPath], with: .automatic)
                }
            }
        }

        class VideoPlayerViewController: UIViewController {
            var videoURL: URL!
            private var playerLayer: AVPlayerLayer!
            
            override func viewDidLoad() {
                super.viewDidLoad()
                view.backgroundColor = .black
                
                let player = AVPlayer(url: videoURL)
                playerLayer = AVPlayerLayer(player: player)
                playerLayer.frame = view.bounds
                playerLayer.videoGravity = .resizeAspect
                view.layer.addSublayer(playerLayer)
                
                let closeButton = UIButton(frame: CGRect(x: 20, y: 50, width: 44, height: 44))
                closeButton.setImage(UIImage(systemName: "xmark.circle.fill"), for: .normal)
                closeButton.tintColor = .white
                closeButton.addTarget(self, action: #selector(close), for: .touchUpInside)
                view.addSubview(closeButton)
                
                player.play()
            }
            
            @objc func close() {
                dismiss(animated: true)
            }
            
            override var prefersStatusBarHidden: Bool { true }
        }

        import AVFoundation
        import AVKit
        EOF
        
        # Create Podfile (Simple version without dependencies)
        cat > VideoDownloaderPro/Podfile << 'EOF'
        platform :ios, '16.0'
        use_frameworks!
        
        target 'VideoDownloaderPro' do
        end
        
        post_install do |installer|
          installer.pods_project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
            end
          end
        end
        EOF
        
        # Create project.pbxproj (Minimal)
        mkdir -p VideoDownloaderPro/VideoDownloaderPro.xcodeproj
        cat > VideoDownloaderPro/VideoDownloaderPro.xcodeproj/project.pbxproj << 'EOF'
        // !$*UTF8*$!
        {
        	archiveVersion = 1;
        	classes = {};
        	objectVersion = 56;
        	objects = {
        		A1 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = main.swift; sourceTree = "<group>"; };
        		A2 = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
        		A3 = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = VideoDownloaderPro.app; sourceTree = BUILT_PRODUCTS_DIR; };
        		A4 = {isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
        		A5 = {isa = PBXGroup; children = (A1, A2); path = VideoDownloaderPro; sourceTree = "<group>"; };
        		A6 = {isa = PBXNativeTarget; buildConfigurationList = A7; buildPhases = (A4, A8); buildRules = (); dependencies = (); name = VideoDownloaderPro; productName = VideoDownloaderPro; productReference = A3; productType = "com.apple.product-type.application"; };
        		A7 = {isa = XCConfigurationList; buildConfigurations = (A9, A10); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
        		A8 = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
        		A9 = {isa = XCBuildConfiguration; buildSettings = {PRODUCT_NAME = VideoDownloaderPro; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; IPHONEOS_DEPLOYMENT_TARGET = 16.0; INFOPLIST_FILE = VideoDownloaderPro/Info.plist; PRODUCT_BUNDLE_IDENTIFIER = com.video.downloader.pro; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; }; name = Debug; };
        		A10 = {isa = XCBuildConfiguration; buildSettings = {PRODUCT_NAME = VideoDownloaderPro; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; IPHONEOS_DEPLOYMENT_TARGET = 16.0; INFOPLIST_FILE = VideoDownloaderPro/Info.plist; PRODUCT_BUNDLE_IDENTIFIER = com.video.downloader.pro; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; }; name = Release; };
        		A11 = {isa = PBXProject; attributes = {LastUpgradeCheck = 1500;}; buildConfigurationList = A12; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, ar); mainGroup = A5; productRefGroup = A5; projectDirPath = ""; projectRoot = ""; targets = (A6); };
        		A12 = {isa = XCConfigurationList; buildConfigurations = (A9, A10); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
        	};
        	rootObject = A11;
        }
        EOF
    
    - name: Build
      run: |
        cd VideoDownloaderPro
        
        # Simple build without CocoaPods
        xcodebuild -project VideoDownloaderPro.xcodeproj \
                   -scheme VideoDownloaderPro \
                   -configuration Release \
                   -sdk iphoneos \
                   -destination 'generic/platform=iOS' \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGN_IDENTITY="" \
                   ARCHS=arm64 \
                   ONLY_ACTIVE_ARCH=NO \
                   build
    
    - name: Package IPA
      run: |
        cd VideoDownloaderPro
        
        # Find the app
        APP_PATH=$(find . -name "*.app" | head -n 1)
        echo "Found app at: $APP_PATH"
        
        # Create Payload
        mkdir Payload
        cp -r "$APP_PATH" Payload/
        
        # Sign with ldid
        ldid -S Payload/*.app
        
        # Create IPA
        zip -r ../VideoDownloaderPro.ipa Payload
        
        cd ..
        ls -lh *.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: VideoDownloaderPro-IPA
        path: VideoDownloaderPro.ipa
    
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        files: VideoDownloaderPro.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
