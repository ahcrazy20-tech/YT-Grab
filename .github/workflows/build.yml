                              }
                          }
                          .padding()
                      }
                      .navigationTitle("اختر العنصر")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }

              private func paste() {
                  if let s = UIPasteboard.general.string, !s.isEmpty {
                      urlText = s.trimmingCharacters(in: .whitespacesAndNewlines)
                  }
              }

              private func show(error: String) {
                  errorMessage = error
                  showError = true
              }

              private func qualityLabel() -> String {
                  if kind == .audio { return "صوت \(audioFormat.uppercased())" }
                  if quality == "max" { return "أعلى جودة" }
                  return "\(quality)p"
              }

              private func extract() {
                  let raw = urlText.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !raw.isEmpty else { show(error: "الصق رابط الفيديو أولاً."); return }
                  guard URL(string: raw) != nil else { show(error: "الرابط غير صالح."); return }

                  Task {
                      isExtracting = true
                      detected = nil
                      pickerItems = []
                      do {
                          async let meta = MetadataFetcher.fetch(for: raw)
                          async let outcome = CobaltClient.extract(source: raw,
                                                                   instances: settings.instances,
                                                                   kind: kind,
                                                                   quality: quality,
                                                                   audioFormat: audioFormat)
                          let (m, out) = try await (meta, outcome)
                          switch out {
                          case .downloadable(let url, let filename):
                              detected = DetectedInfo(title: m.title ?? filename ?? "فيديو",
                                                      service: m.service,
                                                      thumbnailURL: m.thumbnailURL,
                                                      downloadURL: url,
                                                      filename: filename)
                          case .picker(let items):
                              pickerItems = items
                              showPicker = true
                          }
                      } catch {
                          show(error: (error as? EngineError)?.errorDescription ?? error.localizedDescription)
                      }
                      isExtracting = false
                  }
              }

              private func startDownload() {
                  guard let d = detected else { return }
                  Task {
                      downloading = true
                      progress = 0
                      do {
                          let dest = library.makeDestinationURL(filename: d.filename)
                          let savedURL = try await downloader.download(url: d.downloadURL, to: dest) { p in
                              progress = p
                          }

                          let attrs = try? FileManager.default.attributesOfItem(atPath: savedURL.path)
                          let size = (attrs?[.size] as? NSNumber)?.int64Value ?? 0

                          var duration: Double? = nil
                          if kind != .audio {
                              let asset = AVURLAsset(url: savedURL)
                              duration = try? await asset.load(.duration).seconds
                          }

                          let id = UUID()
                          var thumbName: String? = nil
                          if let t = d.thumbnailURL {
                              thumbName = await library.saveThumbnail(remoteURL: t, for: id)
                          }

                          let ext = savedURL.pathExtension
                          let item = SavedVideo(id: id,
                                                title: d.title,
                                                sourceURL: urlText,
                                                relativePath: "Downloads/" + savedURL.lastPathComponent,
                                                service: d.service.isEmpty ? "موقع" : d.service,
                                                quality: qualityLabel(),
                                                format: ext.isEmpty ? "MP4" : ext.uppercased(),
                                                fileSize: size,
                                                duration: duration,
                                                thumbnailName: thumbName,
                                                downloadedAt: Date())
                          library.add(item)
                          downloading = false
                          justSaved = item
                      } catch {
                          downloading = false
                          show(error: "فشل التحميل: \(error.localizedDescription)")
                      }
                  }
              }
          }

