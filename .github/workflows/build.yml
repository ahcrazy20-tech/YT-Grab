                  switch self {
                  case .invalidURL:
                      return "الرابط غير صالح. تأكد أنك نسخت رابط الفيديو كاملاً."
                  case .noInstances:
                      return "لا توجد مثيلات مفعّلة. أضف مثيلاً من الإعدادات."
                  case .unsupportedService(let s):
                      return s.isEmpty ? "هذا الموقع غير مدعوم حالياً." : "الموقع «\(s)» غير مدعوم حالياً."
                  case .needsAuth(let name):
                      return "المثيل «\(name)» يطلب مفتاح API. أضف مفتاحك من الإعدادات، أو شغّل مثيلك الخاص (انظر الإعدادات)."
                  case .rateLimited(let name):
                      return "تم تجاوز حد الطلبات في «\(name)». انتظر قليلاً أو جرّب مثيلاً آخر."
                  case .server(let code):
                      return "خطأ من الخادم: \(code)"
                  case .notFound:
                      return "لم يتم العثور على الفيديو. قد يكون محذوفاً أو خاصاً."
                  }
              }
          }

          final class CobaltClient {

              static let qualityOptions = ["max", "2160", "1440", "1080", "720", "480", "360", "240", "144"]

              /// يرسل الطلب لكل المثيلات المفعّلة حتى ينجح واحد
              static func extract(source: String,
                                  instances: [InstanceConfig],
                                  kind: DownloadKind,
                                  quality: String,
                                  audioFormat: String) async throws -> ExtractOutcome {

                  let active = instances.filter {
                      $0.enabled && !$0.url.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty
                  }
                  guard !active.isEmpty else { throw EngineError.noInstances }

                  var body: [String: Any] = [
                      "url": source,
                      "downloadMode": kind.rawValue,
                      "videoQuality": quality,
                      "audioFormat": audioFormat,
                      "filenameStyle": "basic",
                      "youtubeVideoCodec": "h264"
                  ]
                  if kind == .audio { body.removeValue(forKey: "videoQuality") }
                  if kind == .mute { body.removeValue(forKey: "audioFormat") }

                  var best: EngineError = .server("غير معروف")
                  var bestRank = 0

                  for instance in active {
                      do {
                          let resp = try await request(instance: instance, body: body)
                          switch resp.status {
                          case "tunnel", "redirect":
                              if let raw = resp.url, let u = URL(string: raw) {
                                  return .downloadable(url: u, filename: resp.filename)
                              }
                              if rank(.server("")) > bestRank { best = .server("لم يُرجع الخادم رابط تحميل"); bestRank = 1 }
                          case "picker":
                              if let items = resp.picker, !items.isEmpty {
                                  return .picker(items)
                              }
                              if rank(.notFound) > bestRank { best = .notFound; bestRank = rank(.notFound) }
                          case "error":
                              let code = resp.error?.code ?? ""
                              let text = resp.text ?? ""
                              let service = resp.error?.context?.service ?? ""
                              let e = mapError(code: code, text: text, service: service, instance: instance)
                              if rank(e) > bestRank { best = e; bestRank = rank(e) }
                          default:
                              if rank(.server("استجابة غير مفهومة")) > bestRank {
                                  best = .server("استجابة غير مفهومة"); bestRank = 1
                              }
                          }
                      } catch {
                          let e = (error as? EngineError) ?? .server(error.localizedDescription)
                          if rank(e) > bestRank { best = e; bestRank = rank(e) }
                      }
                  }
                  throw best
              }

              private static func mapError(code: String, text: String, service: String, instance: InstanceConfig) -> EngineError {
                  if code.contains("auth") { return .needsAuth(instance.name) }
                  if code.contains("rate") || code.contains("limit") { return .rateLimited(instance.name) }
                  if code.contains("unsupported") { return .unsupportedService(service) }
                  if code.contains("not_found") || code.contains("not found") { return .notFound }
                  if code.isEmpty && !text.isEmpty {
                      return .server("تعذّرت المعالجة على «\(instance.name)»")
                  }
                  return .server(code)
              }

              private static func rank(_ e: EngineError) -> Int {
                  switch e {
                  case .unsupportedService: return 5
                  case .notFound: return 4
                  case .rateLimited: return 3
                  case .needsAuth: return 2
                  default: return 1
                  }
              }

              static func request(instance: InstanceConfig, body: [String: Any]) async throws -> CobaltResponse {
                  var base = instance.url.trimmingCharacters(in: .whitespacesAndNewlines)
                  while base.hasSuffix("/") { base.removeLast() }

                  var path = instance.path.trimmingCharacters(in: .whitespacesAndNewlines)
                  if path.isEmpty { path = "/" } else if !path.hasPrefix("/") { path = "/" + path }

                  guard let endpoint = URL(string: base + path) else { throw EngineError.invalidURL }

                  var req = URLRequest(url: endpoint)
                  req.httpMethod = "POST"
                  req.setValue("application/json", forHTTPHeaderField: "Accept")
                  req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  if !instance.apiKey.isEmpty {
                      req.setValue("Api-Key \(instance.apiKey)", forHTTPHeaderField: "Authorization")
                  } else if !instance.bearerToken.isEmpty {
                      req.setValue("Bearer \(instance.bearerToken)", forHTTPHeaderField: "Authorization")
                  }
                  req.timeoutInterval = 120
                  req.httpBody = try JSONSerialization.data(withJSONObject: body)

                  let (data, _) = try await URLSession.shared.data(for: req)
                  if let decoded = try? JSONDecoder().decode(CobaltResponse.self, from: data) {
                      return decoded
                  }
                  throw EngineError.server("استجابة غير متوقعة من «\(instance.name)»")
              }
          }
