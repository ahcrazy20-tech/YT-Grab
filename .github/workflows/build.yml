          /// مكتبة الفيديوهات المحفوظة — حفظ دائم بكل التفاصيل
          final class LibraryStore: ObservableObject {

              @Published var items: [SavedVideo] = []

              private let indexURL: URL
              private let thumbDir: URL
              private let downloadsDir: URL

              var documentsDir: URL {
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
              }

              init() {
                  let docs = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  indexURL = docs.appendingPathComponent("library.json")
                  thumbDir = docs.appendingPathComponent("Thumbnails")
                  downloadsDir = docs.appendingPathComponent("Downloads")
                  try? FileManager.default.createDirectory(at: thumbDir, withIntermediateDirectories: true)
                  try? FileManager.default.createDirectory(at: downloadsDir, withIntermediateDirectories: true)
                  load()
              }

              private func load() {
                  guard let data = try? Data(contentsOf: indexURL),
                        let decoded = try? JSONDecoder().decode([SavedVideo].self, from: data) else { return }
                  items = decoded
              }

              private func persist() {
                  if let data = try? JSONEncoder().encode(items) {
                      try? data.write(to: indexURL, options: .atomic)
                  }
              }

              func add(_ item: SavedVideo) {
                  items.removeAll { $0.id == item.id }
                  items.insert(item, at: 0)
                  persist()
              }

              func remove(_ item: SavedVideo) {
                  if let url = item.fileURL { try? FileManager.default.removeItem(at: url) }
                  if let name = item.thumbnailName {
                      try? FileManager.default.removeItem(at: thumbDir.appendingPathComponent(name))
                  }
                  items.removeAll { $0.id == item.id }
                  persist()
              }

              func makeDestinationURL(filename: String?) -> URL {
                  let safe = Self.sanitize(filename ?? "video_\(Int(Date().timeIntervalSince1970))")
                  return downloadsDir.appendingPathComponent(safe)
              }

              static func sanitize(_ s: String) -> String {
                  var out = s
                  let bad = CharacterSet(charactersIn: "/\\?%*|\"<>:")
                  out = out.components(separatedBy: bad).joined(separator: "_")
                  out = out.trimmingCharacters(in: .whitespacesAndNewlines)
                  if out.isEmpty { out = "video_\(Int(Date().timeIntervalSince1970))" }
                  return out
              }

              @discardableResult
              func saveThumbnail(remoteURL: String, for id: UUID) async -> String? {
                  guard let url = URL(string: remoteURL) else { return nil }
                  do {
                      var req = URLRequest(url: url)
                      req.timeoutInterval = 30
                      let (data, _) = try await URLSession.shared.data(for: req)
                      let name = "\(id.uuidString).jpg"
                      try data.write(to: thumbDir.appendingPathComponent(name), options: .atomic)
                      return name
                  } catch {
                      return nil
                  }
              }
          }
