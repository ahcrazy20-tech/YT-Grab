                  progress = 0
                  defer { isDownloading = false }

                  let ext = extensionFor(option: option)
                  let fileName = finalFileName(customName: customName, fallback: option.filename ?? title, ext: ext)
                  let dest = library.makeDestinationURL(filename: fileName)

                  let savedURL: URL
                  if option.isHLS {
                      savedURL = try await HLSExporter.export(m3u8: option.directURL, to: dest)
                  } else {
                      savedURL = try await fileDownloader.download(url: option.directURL, to: dest) { p in
                          self.progress = p
                      }
                  }

                  let attrs = try? FileManager.default.attributesOfItem(atPath: savedURL.path)
                  let size = (attrs?[.size] as? NSNumber)?.int64Value ?? 0

                  var duration: Double? = nil
                  if option.kind != .audio {
                      let asset = AVURLAsset(url: savedURL)
                      duration = try? await asset.load(.duration).seconds
                  }

                  let id = UUID()
                  var thumbName: String? = nil
                  if let t = thumbnailURL {
                      thumbName = await library.saveThumbnail(remoteURL: t, for: id)
                  }

                  let item = SavedVideo(id: id,
                                        title: title.isEmpty ? savedURL.lastPathComponent : title,
                                        sourceURL: pageURL,
                                        relativePath: "Downloads/" + savedURL.lastPathComponent,
                                        service: service.isEmpty ? "موقع" : service,
                                        quality: option.label,
                                        format: (ext.isEmpty ? "MP4" : ext).uppercased(),
                                        fileSize: size,
                                        duration: duration,
                                        thumbnailName: thumbName,
                                        downloadedAt: Date())
                  library.add(item)
                  return item
              }

              private func extensionFor(option: StreamOption) -> String {
                  if option.isHLS { return "mp4" }
                  if let f = option.filename, !f.isEmpty {
                      let e = (f as NSString).pathExtension
                      if !e.isEmpty { return e }
                  }
                  let c = option.container.lowercased()
                  switch c {
                  case "webm": return "webm"
                  case "m4a": return "m4a"
                  case "mp3": return "mp3"
                  case "opus": return "opus"
                  case "ogg": return "ogg"
                  case "wav": return "wav"
                  case "aac": return "aac"
                  default: return "mp4"
                  }
              }

              private func finalFileName(customName: String?, fallback: String, ext: String) -> String {
                  var name = customName ?? fallback
                  name = name.trimmingCharacters(in: .whitespacesAndNewlines)
                  if name.isEmpty { name = "video_" + String(Int(Date().timeIntervalSince1970)) }
                  let safe = LibraryStore.sanitize(name)
                  let known = ["mp4", "m4v", "mov", "webm", "m4a", "mp3", "aac", "opus", "ogg", "wav", "m3u8"]
                  let lower = safe.lowercased()
                  let hasKnownExt = known.contains { lower.hasSuffix("." + $0) }
                  if hasKnownExt { return safe }
                  return safe + "." + ext
              }
          }
