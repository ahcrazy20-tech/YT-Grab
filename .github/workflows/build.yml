# ============================================================================
#  BUILD.yml  —  ملف واحد يبني تطبيق "YT Grab" بالكامل لوحده (نسخة خارقة)
#  ----------------------------------------------------------------------------
#  مكتفٍ ذاتياً: يكتب كل ملفات المشروع، يولّد الأيقونة، يثبّت XcodeGen،
#  يبني بدون توقيع، ويحزم .ipa + .tipa جاهزة لـ TrollStore.
#
#  ✔ ارفع هذا الملف فقط على المسار: .github/workflows/BUILD.yml
#  ✔ متوافق مع: iPhone 11 Pro Max / iOS 16.4 (TrollStore)
# ============================================================================
name: Build YTGrab for TrollStore (one file)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      # 1) توليد كل ملفات المشروع
      - name: Generate all project files
        shell: bash
        run: |
          set -eo pipefail
          echo "==> كتابة ملفات المشروع..."

          gen() {
            mkdir -p "$(dirname "$1")"
            cat > "$1"
          }

          # ---------------- App icon (مولّدة برمجياً) ----------------
          python3 - <<'PYEOF'
          import zlib, struct, os
          os.makedirs("Sources/Assets.xcassets/AppIcon.appiconset", exist_ok=True)
          W = H = 1024
          def clamp(v): return max(0, min(255, int(v)))
          def in_tri(px, py, ax, ay, bx, by, cx, cy):
              d1 = (px-bx)*(ay-by) - (ax-bx)*(py-by)
              d2 = (px-cx)*(by-cy) - (bx-cx)*(py-cy)
              d3 = (px-ax)*(cy-ay) - (cx-ax)*(py-ay)
              neg = (d1 < 0) or (d2 < 0) or (d3 < 0)
              pos = (d1 > 0) or (d2 > 0) or (d3 > 0)
              return not (neg and pos)
          rows = []
          for y in range(H):
              row = bytearray(b'\x00')
              for x in range(W):
                  t = (x + y) / (2 * W)
                  r, g, b = clamp(20 + 44*t), clamp(14 + 14*t), clamp(42 + 72*t)
                  col = (r, g, b)
                  if in_tri(x, y, 400, 320, 400, 704, 690, 512):
                      tt = (x - 400) / 290.0
                      col = (clamp(255 - 105*tt), clamp(80 + 10*tt), clamp(170 + 85*tt))
                      if 482 <= x <= 542 and 430 <= y <= 555:
                          col = (255, 255, 255)
                      if in_tri(x, y, 438, 555, 586, 555, 512, 618):
                          col = (255, 255, 255)
                  row += bytes(col)
              rows.append(bytes(row))
          raw = b''.join(rows)
          def chunk(typ, data):
              return struct.pack('>I', len(data)) + typ + data + struct.pack('>I', zlib.crc32(typ + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          open("Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png", "wb").write(png)
          print("App icon generated OK:", len(png), "bytes")
          PYEOF

          # ---------------- project.yml ----------------
          gen project.yml <<'__YTG_0000__'
          name: YTGrab
          options:
            bundleIdPrefix: com.ytgrab
            deploymentTarget:
              iOS: "16.0"
            projectFormat: "xcode15_0"
            xcodeVersion: "15.0"
            createIntermediateGroups: true

          targets:
            YTGrab:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              info:
                path: Sources/Info.plist
                properties:
                  CFBundleDisplayName: "YT Grab"
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UIBackgroundModes:
                    - audio
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  LSApplicationCategoryType: "public.app-category.video"
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_NAME: YTGrab
                  PRODUCT_BUNDLE_IDENTIFIER: com.ytgrab.app
                  SWIFT_VERSION: "5.9"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: false
                  CODE_SIGN_STYLE: Automatic

          schemes:
            YTGrab:
              build:
                targets:
                  YTGrab: all
              run:
                config: Debug
              archive:
                config: Release
          __YTG_0000__

          # ---------------- Sources/App/YTGrabApp.swift ----------------
          gen Sources/App/YTGrabApp.swift <<'__YTG_0001__'
          import SwiftUI

          @main
          struct YTGrabApp: App {
              @StateObject private var library = LibraryStore()
              @StateObject private var settings = SettingsStore()

              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .environmentObject(library)
                          .environmentObject(settings)
                          .environment(\.layoutDirection, .rightToLeft)
                          .preferredColorScheme(.dark)
                  }
              }
          }

          struct RootView: View {
              var body: some View {
                  TabView {
                      HomeView()
                          .tabItem { Label("تحميل", systemImage: "arrow.down.circle.fill") }
                      BrowserView()
                          .tabItem { Label("المتصفح", systemImage: "safari.fill") }
                      LibraryView()
                          .tabItem { Label("المكتبة", systemImage: "folder.fill") }
                      SettingsView()
                          .tabItem { Label("الإعدادات", systemImage: "gearshape.fill") }
                  }
              }
          }
          __YTG_0001__

          # ---------------- Sources/Assets.xcassets/Contents.json ----------------
          gen Sources/Assets.xcassets/Contents.json <<'__YTG_0002__'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          __YTG_0002__

          # ---------------- Sources/Assets.xcassets/AppIcon.appiconset/Contents.json ----------------
          gen Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'__YTG_0003__'
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          __YTG_0003__

          # ---------------- Sources/Browser/AdBlocker.swift ----------------
          gen Sources/Browser/AdBlocker.swift <<'__YTG_0004__'
          import Foundation
          import WebKit

          // ============================================================
          //  مانع إعلانات قوي — حجب نطاقات + قواعد محتوى + حقن CSS/JS
          // ============================================================

          enum AdBlocker {

              static let blockedDomains: [String] = [
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                  "adservice.google.com", "adnxs.com", "adsrvr.org", "taboola.com",
                  "outbrain.com", "criteo.com", "criteo.net", "scorecardresearch.com",
                  "quantserve.com", "amazon-adsystem.com", "moatads.com", "pubmatic.com",
                  "rubiconproject.com", "openx.net", "adform.net", "smartadserver.com",
                  "teads.tv", "springserve.com", "yieldmo.com", "mgid.com", "popads.net",
                  "popcash.net", "propellerads.com", "adsterra.com", "admob.com",
                  "applovin.com", "vungle.com", "chartboost.com", "mopub.com",
                  "unityads.unity3d.com", "sascdn.com", "adcolony.com", "inmobi.com",
                  "ironsrc.com", "appnext.com", "advertising.com", "2mdn.net"
              ]

              static func isBlocked(host: String?) -> Bool {
                  guard let h = host?.lowercased() else { return false }
                  for d in blockedDomains {
                      if h == d || h.hasSuffix("." + d) { return true }
                  }
                  return false
              }

              static let rulesJSON: String = {
                  var rules: [[String: Any]] = []
                  for d in blockedDomains {
                      rules.append([
                          "trigger": ["url-filter": ".*", "if-domain": [d]],
                          "action": ["type": "block"]
                      ])
                  }
                  let selectors = [
                      "[id*=\"advert\"]", "[class*=\"advert\"]", "[id*=\"google_ads\"]",
                      "[class*=\"google_ads\"]", "ins.adsbygoogle", ".ytp-ad-module",
                      ".ytp-ad-overlay-container", ".ytp-ad-player-overlay", ".ad-container",
                      ".ad-slot", ".ad-banner", ".sponsored", "[class*=\"sponsored\"]",
                      "#player-ads", ".video-ads", ".ad-showing", ".ad-interrupting"
                  ]
                  for sel in selectors {
                      rules.append([
                          "trigger": ["url-filter": ".*"],
                          "action": ["type": "css-display-none", "selector": sel]
                      ])
                  }
                  let data = try! JSONSerialization.data(withJSONObject: rules)
                  return String(data: data, encoding: .utf8) ?? "[]"
              }()

              static func compile(completion: @escaping (WKContentRuleList?) -> Void) {
                  WKContentRuleListStore.default().compileContentRuleList(
                      forIdentifier: "ytgrab-adblock",
                      encodedContentRuleList: rulesJSON
                  ) { list, _ in
                      DispatchQueue.main.async { completion(list) }
                  }
              }

              static let adHideJS = """
              (function(){
                function hide(){
                  try{
                    var s='.ad,.ads,.advert,.advertisement,[id*="google_ads"],ins.adsbygoogle,.ytp-ad-module,.ytp-ad-player-overlay,[class*="sponsored"],.ad-container,.ad-slot,.ad-banner,#player-ads,.video-ads';
                    var els=document.querySelectorAll(s);
                    for(var i=0;i<els.length;i++){ els[i].style.display='none'; }
                  }catch(e){}
                }
                function start(){
                  hide();
                  try{
                    var mo=new MutationObserver(hide);
                    if(document.body){ mo.observe(document.body,{subtree:true,childList:true}); }
                  }catch(e){}
                }
                if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',start); } else { start(); }
              })();
              """

              static let mediaSniffJS = """
              (function(){
                var last='';
                function post(){
                  try{
                    var m='';
                    var v=document.querySelector('video');
                    if(v){ m=v.currentSrc||v.src||''; }
                    if(!m){ var a=document.querySelector('audio'); if(a){ m=a.currentSrc||a.src||''; } }
                    if(!m){ var s=document.querySelector('video source, audio source'); if(s){ m=s.src||''; } }
                    if(m && m.indexOf('blob:')===0){ m=''; }
                    var t=document.title||'';
                    var og=document.querySelector('meta[property="og:title"]');
                    if(og&&og.getAttribute('content')){ t=og.getAttribute('content'); }
                    var img='';
                    var ogi=document.querySelector('meta[property="og:image"]');
                    if(ogi&&ogi.getAttribute('content')){ img=ogi.getAttribute('content'); }
                    var key=m+'|'+t+'|'+img;
                    if(key===last){ return; }
                    last=key;
                    window.webkit.messageHandlers.yt.postMessage({type:'media',url:m,title:t,img:img,page:location.href});
                  }catch(e){}
                }
                function start(){
                  post();
                  try{
                    document.addEventListener('play',function(e){ if(e.target&&(e.target.tagName==='VIDEO'||e.target.tagName==='AUDIO')){ post(); } },true);
                    document.addEventListener('loadedmetadata',function(e){ if(e.target&&e.target.tagName==='VIDEO'){ post(); } },true);
                    var mo=new MutationObserver(post);
                    if(document.body){ mo.observe(document.body,{subtree:true,childList:true,attributes:true}); }
                  }catch(e){}
                }
                if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',start); } else { start(); }
              })();
              """
          }
          __YTG_0004__

          # ---------------- Sources/Browser/BrowserView.swift ----------------
          gen Sources/Browser/BrowserView.swift <<'__YTG_0005__'
          import SwiftUI
          import WebKit
          import UIKit

          // ============================================================
          //  المتصفح المدمج — WKWebView + كشف الوسائط + مانع إعلانات
          // ============================================================

          struct DetectedMedia {
              var url: String
              var title: String
              var thumb: String
          }

          enum BrowserCommand: Equatable {
              case go, back, forward, reload, home
          }

          struct BrowserView: View {
              @EnvironmentObject var library: LibraryStore
              @EnvironmentObject var settings: SettingsStore

              var initialURL: String? = nil
              var allowsDismiss: Bool = false

              @State private var urlText = ""
              @State private var pageTitle = ""
              @State private var progress: Double = 0
              @State private var canBack = false
              @State private var canForward = false
              @State private var detected: DetectedMedia?
              @State private var navToken = 0
              @State private var command: BrowserCommand?
              @State private var showExtract = false
              @State private var showError = false
              @State private var errorMsg: String?

              @Environment(\.dismiss) private var dismiss

              init(initialURL: String? = nil, allowsDismiss: Bool = false) {
                  self.initialURL = initialURL
                  self.allowsDismiss = allowsDismiss
              }

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          toolbar
                          ZStack(alignment: .bottom) {
                              WebView(urlText: $urlText,
                                      pageTitle: $pageTitle,
                                      progress: $progress,
                                      canBack: $canBack,
                                      canForward: $canForward,
                                      detected: $detected,
                                      navToken: $navToken,
                                      command: $command,
                                      adBlock: settings.adBlockEnabled)
                              if let d = detected, !d.url.isEmpty {
                                  mediaBar(d)
                              }
                              if dm.isDownloading {
                                  VStack(spacing: 6) {
                                      ProgressView(value: dm.progress)
                                          .progressViewStyle(.linear)
                                          .tint(.green)
                                      Text("جارٍ التحميل… \(Int(dm.progress * 100))%")
                                          .font(.caption2)
                                          .foregroundColor(.secondary)
                                  }
                                  .padding(12)
                                  .background(.ultraThinMaterial)
                                  .cornerRadius(12)
                                  .padding(10)
                              }
                          }
                      }
                      .navigationTitle(pageTitle.isEmpty ? "المتصفح" : pageTitle)
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          if allowsDismiss {
                              ToolbarItem(placement: .cancellationAction) {
                                  Button("إغلاق") { dismiss() }
                              }
                          }
                      }
                      .onAppear {
                          if let u = initialURL, urlText.isEmpty {
                              urlText = u
                              navToken += 1
                          }
                      }
                      .sheet(isPresented: $showExtract) {
                          ExtractSheet(pageURL: urlText)
                      }
                      .fullScreenCover(item: $savedItem) { item in
                          PlayerView(item: item)
                      }
                      .alert("خطأ", isPresented: $showError) {
                          Button("حسناً", role: .cancel) {}
                      } message: {
                          Text(errorMsg ?? "")
                      }
                  }
              }

              private var toolbar: some View {
                  VStack(spacing: 6) {
                      HStack(spacing: 8) {
                          TextField("عنوان أو بحث", text: $urlText)
                              .textInputAutocapitalization(.never)
                              .autocorrectionDisabled(true)
                              .keyboardType(.URL)
                              .padding(10)
                              .background(Color.white.opacity(0.08))
                              .cornerRadius(10)
                          Button { command = .go } label: {
                              Image(systemName: "arrow.right.circle.fill")
                                  .font(.title3)
                          }
                      }
                      HStack(spacing: 22) {
                          Button { command = .back } label: {
                              Image(systemName: "chevron.right").font(.title3)
                          }.disabled(!canBack).opacity(canBack ? 1 : 0.4)
                          Button { command = .forward } label: {
                              Image(systemName: "chevron.left").font(.title3)
                          }.disabled(!canForward).opacity(canForward ? 1 : 0.4)
                          Button { command = .reload } label: {
                              Image(systemName: "arrow.clockwise").font(.title3)
                          }
                          Button { command = .home } label: {
                              Image(systemName: "house").font(.title3)
                          }
                          Spacer()
                          Button {
                              if urlText.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                                  errorMsg = "افتح صفحة تحتوي فيديو أولاً."
                                  showError = true
                              } else {
                                  showExtract = true
                              }
                          } label: {
                              Label("تحميل الصفحة", systemImage: "arrow.down.circle.fill")
                                  .font(.footnote.weight(.semibold))
                                  .padding(.horizontal, 12)
                                  .padding(.vertical, 7)
                                  .background(Color(red: 0.45, green: 0.28, blue: 0.95))
                                  .foregroundColor(.white)
                                  .cornerRadius(9)
                          }
                      }
                      ProgressView(value: progress)
                          .progressViewStyle(.linear)
                          .opacity(progress > 0 && progress < 1 ? 1 : 0)
                  }
                  .padding(10)
                  .background(Color.white.opacity(0.05))
              }

              private func mediaBar(_ d: DetectedMedia) -> some View {
                  HStack(spacing: 10) {
                      Image(systemName: "film.fill")
                          .foregroundColor(.green)
                      VStack(alignment: .leading, spacing: 2) {
                          Text(d.title.isEmpty ? "تم اكتشاف وسائط" : d.title)
                              .font(.footnote.weight(.semibold))
                              .lineLimit(1)
                          Text("اضغط للتحميل المباشر")
                              .font(.caption2)
                              .foregroundColor(.secondary)
                      }
                      Spacer()
                      Button {
                          guard let u = URL(string: d.url) else { return }
                          let isHLS = d.url.lowercased().hasSuffix(".m3u8")
                          let opt = StreamOption(label: isHLS ? "بث مباشر" : "ملف مباشر",
                                                 kind: .auto,
                                                 directURL: u,
                                                 filename: u.lastPathComponent,
                                                 isHLS: isHLS,
                                                 container: "MP4",
                                                 size: nil)
                          showRenameFor(opt, title: d.title.isEmpty ? "media" : d.title, thumb: d.thumb)
                      } label: {
                          Label("تنزيل", systemImage: "arrow.down.circle.fill")
                              .font(.footnote.weight(.bold))
                              .padding(.horizontal, 14)
                              .padding(.vertical, 8)
                              .background(Color.green)
                              .foregroundColor(.white)
                              .cornerRadius(10)
                      }
                  }
                  .padding(12)
                  .background(.ultraThinMaterial)
                  .cornerRadius(14)
                  .padding(10)
                  .alert("اسم الملف", isPresented: $showRename) {
                      TextField("اسم الملف", text: $renameText)
                      Button("تحميل") { confirmRenameDownload() }
                      Button("إلغاء", role: .cancel) {}
                  } message: {
                      Text("غيّر اسم الفيديو قبل التحميل (اختياري).")
                  }
              }

              // إعادة تسمية + تحميل (مباشر من المتصفح)
              @State private var renameText = ""
              @State private var showRename = false
              @State private var pendingOption: StreamOption?
              @State private var pendingTitle = ""
              @State private var pendingThumb = ""
              @State private var downloading = false
              @State private var downloadProgress: Double = 0
              @State private var savedItem: SavedVideo?
              @StateObject private var dm = DownloadManager()

              private func showRenameFor(_ opt: StreamOption, title: String, thumb: String) {
                  pendingOption = opt
                  pendingTitle = title
                  pendingThumb = thumb
                  renameText = title
                  showRename = true
              }

              private func confirmRenameDownload() {
                  guard let opt = pendingOption else { return }
                  Task {
                      downloading = true
                      defer { downloading = false }
                      do {
                          let item = try await dm.download(option: opt,
                                                           title: pendingTitle,
                                                           service: MetadataFetcher.serviceName(for: urlText),
                                                           thumbnailURL: pendingThumb.isEmpty ? nil : pendingThumb,
                                                           pageURL: urlText,
                                                           customName: renameText,
                                                           library: library)
                          savedItem = item
                      } catch {
                          errorMsg = error.localizedDescription
                          showError = true
                      }
                  }
              }
          }

          // MARK: - WKWebView wrapper

          struct WebView: UIViewRepresentable {
              @Binding var urlText: String
              @Binding var pageTitle: String
              @Binding var progress: Double
              @Binding var canBack: Bool
              @Binding var canForward: Bool
              @Binding var detected: DetectedMedia?
              @Binding var navToken: Int
              @Binding var command: BrowserCommand?
              var adBlock: Bool

              func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  let controller = WKUserContentController()
                  controller.add(context.coordinator, name: "yt")
                  controller.addUserScript(WKUserScript(source: AdBlocker.mediaSniffJS,
                                                        injectionTime: .atDocumentEnd,
                                                        forMainFrameOnly: false))
                  if adBlock {
                      controller.addUserScript(WKUserScript(source: AdBlocker.adHideJS,
                                                            injectionTime: .atDocumentStart,
                                                            forMainFrameOnly: false))
                      AdBlocker.compile { list in
                          if let list = list {
                              controller.add(list)
                          }
                      }
                  }
                  config.userContentController = controller
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = context.coordinator
                  webView.uiDelegate = context.coordinator
                  webView.allowsBackForwardNavigationGestures = true
                  webView.backgroundColor = UIColor(red: 0.02, green: 0.02, blue: 0.05, alpha: 1)
                  context.coordinator.observe(webView)
                  return webView
              }

              func updateUIView(_ webView: WKWebView, context: Context) {
                  context.coordinator.parent = self
                  if let cmd = command {
                      command = nil
                      switch cmd {
                      case .go: load(urlText, in: webView)
                      case .back: webView.goBack()
                      case .forward: webView.goForward()
                      case .reload: webView.reload()
                      case .home: webView.load(URLRequest(url: URL(string: "https://www.google.com")!))
                      }
                  }
                  if context.coordinator.loadedToken != navToken {
                      context.coordinator.loadedToken = navToken
                      load(urlText, in: webView)
                  }
              }

              private func load(_ text: String, in webView: WKWebView) {
                  var t = text.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !t.isEmpty else { return }
                  if !t.contains("://") { t = "https://" + t }
                  if let u = URL(string: t) {
                      webView.load(URLRequest(url: u))
                  }
              }

              static func dismantleUIView(_ webView: WKWebView, coordinator: Coordinator) {
                  coordinator.unobserve()
                  webView.configuration.userContentController.removeScriptMessageHandler(forName: "yt")
              }

              final class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate, WKScriptMessageHandler {
                  var parent: WebView
                  var loadedToken: Int = -1
                  private var progressObs: NSKeyValueObservation?
                  private var backObs: NSKeyValueObservation?
                  private var fwdObs: NSKeyValueObservation?

                  init(_ parent: WebView) {
                      self.parent = parent
                  }

                  func observe(_ webView: WKWebView) {
                      progressObs = webView.observe(\.estimatedProgress, options: [.new]) { wv, _ in
                          DispatchQueue.main.async { self.parent.progress = wv.estimatedProgress }
                      }
                      backObs = webView.observe(\.canGoBack, options: [.new]) { wv, _ in
                          DispatchQueue.main.async { self.parent.canBack = wv.canGoBack }
                      }
                      fwdObs = webView.observe(\.canGoForward, options: [.new]) { wv, _ in
                          DispatchQueue.main.async { self.parent.canForward = wv.canGoForward }
                      }
                  }

                  func unobserve() {
                      progressObs?.invalidate()
                      backObs?.invalidate()
                      fwdObs?.invalidate()
                  }

                  func userContentController(_ userContentController: WKUserContentController,
                                             didReceive message: WKScriptMessage) {
                      guard let dict = message.body as? [String: Any] else { return }
                      let url = dict["url"] as? String ?? ""
                      let title = dict["title"] as? String ?? ""
                      let thumb = dict["img"] as? String ?? ""
                      DispatchQueue.main.async {
                          self.parent.detected = DetectedMedia(url: url, title: title, thumb: thumb)
