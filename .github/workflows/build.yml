                              } else if let e = errorMessage {
                                  VStack(spacing: 12) {
                                      Image(systemName: "exclamationmark.triangle")
                                          .font(.largeTitle)
                                          .foregroundColor(.orange)
                                      Text(e)
                                          .multilineTextAlignment(.center)
                                          .padding()
                                      Button("إعادة المحاولة") { Task { await resolve() } }
                                          .buttonStyle(.borderedProminent)
                                  }
                              } else {
                                  VStack(spacing: 12) {
                                      ProgressView()
                                      Text("جارٍ الكشف…")
                                          .foregroundColor(.secondary)
                                  }
                              }
                          }
                      }
                      .navigationTitle("التحميل")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) {
                              Button("إغلاق") { dismiss() }
                          }
                      }
                      .task { await resolve() }
                      .alert("اسم الملف", isPresented: $showRename) {
                          TextField("اسم الملف", text: $renameText)
                          Button("تحميل") { confirmDownload() }
                          Button("إلغاء", role: .cancel) {}
                      } message: {
                          Text("غيّر اسم الفيديو قبل التحميل (اختياري).")
                      }
                      .fullScreenCover(item: $savedItem) { item in
                          PlayerView(item: item)
                      }
                  }
              }

              private func resolve() async {
                  loading = true
                  errorMessage = nil
                  resolved = nil
                  do {
                      let r = try await Extractor.resolve(pageURL: pageURL, settings: settings)
                      resolved = r
                      if let first = r.options.first {
                          selected = first
                          renameText = r.title
                      }
                  } catch {
                      errorMessage = (error as? EngineError)?.errorDescription ?? error.localizedDescription
                  }
                  loading = false
              }

              private func optionsList(_ r: ResolvedMedia) -> some View {
                  VStack(spacing: 0) {
                      if !r.title.isEmpty {
                          VStack(alignment: .leading, spacing: 4) {
                              Text(r.title).font(.headline).lineLimit(2)
                              Text(r.service.isEmpty ? "موقع مدعوم" : r.service)
                                  .font(.caption)
                                  .foregroundColor(.secondary)
                          }
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .padding(.horizontal, 16)
                          .padding(.top, 12)
                      }
                      ScrollView {
                          VStack(spacing: 8) {
                              ForEach(r.options) { opt in
                                  optionRow(opt)
                              }
                          }
                          .padding(16)
                      }
                      if dm.isDownloading {
                          VStack(spacing: 6) {
                              ProgressView(value: dm.progress)
                                  .progressViewStyle(.linear)
                                  .tint(.green)
                              Text("جارٍ التحميل… \(Int(dm.progress * 100))%")
                                  .font(.footnote)
                                  .foregroundColor(.secondary)
                          }
                          .padding(16)
                      }
                      Button {
                          guard let opt = selected else { return }
                          renameText = r.title.isEmpty ? (opt.filename ?? "video") : r.title
                          showRename = true
                      } label: {
                          Label(dm.isDownloading ? "جارٍ التحميل…" : "تحميل الآن",
                                systemImage: "arrow.down.circle.fill")
                              .font(.headline)
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 14)
                              .background(Color.green.opacity(0.9))
                              .foregroundColor(.white)
                              .cornerRadius(14)
                      }
                      .disabled(selected == nil || dm.isDownloading)
                      .padding(.horizontal, 16)
                      .padding(.bottom, 14)
                  }
              }

              private func optionRow(_ opt: StreamOption) -> some View {
                  Button {
                      selected = opt
                  } label: {
                      HStack(spacing: 10) {
                          Image(systemName: iconFor(opt))
                              .foregroundColor(.green)
                          VStack(alignment: .leading, spacing: 3) {
                              Text(opt.label)
                                  .font(.subheadline.weight(.semibold))
                              HStack(spacing: 8) {
                                  Text(opt.container.uppercased())
                                      .font(.caption2)
                                      .foregroundColor(.secondary)
                                  if let s = opt.size, s > 0 {
                                      Text(Formatters.bytes(s))
                                          .font(.caption2)
                                          .foregroundColor(.secondary)
                                  }
                              }
                          }
                          Spacer()
                          Image(systemName: selected == opt ? "checkmark.circle.fill" : "circle")
                              .foregroundColor(selected == opt ? .green : .secondary)
                      }
                      .padding(12)
                      .background(selected == opt ? Color.white.opacity(0.12) : Color.white.opacity(0.06))
                      .cornerRadius(12)
                  }
                  .buttonStyle(.plain)
              }

              private func iconFor(_ opt: StreamOption) -> String {
                  switch opt.kind {
                  case .audio: return "music.note"
                  case .mute: return "video.slash"
                  default: return "play.rectangle.fill"
                  }
              }

              private func confirmDownload() {
                  guard let opt = selected, let r = resolved else { return }
                  Task {
                      do {
                          let item = try await dm.download(option: opt,
                                                           title: r.title,
                                                           service: r.service,
                                                           thumbnailURL: r.thumbnailURL,
                                                           pageURL: r.pageURL,
                                                           customName: renameText,
                                                           library: library)
                          savedItem = item
                      } catch {
                          errorMessage = error.localizedDescription
                      }
                  }
              }
          }
