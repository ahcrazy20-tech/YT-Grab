                                  .font(.subheadline).foregroundColor(.secondary)
                              LazyVGrid(columns: Array(repeating: GridItem(.flexible(), spacing: 8), count: 3), spacing: 8) {
                                  ForEach(qualities, id: \.self) { q in
                                      QualityChip(label: q == "max" ? "أعلى جودة" : "\(q)p",
