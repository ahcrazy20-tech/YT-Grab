                                                  .fill(Color.gray.opacity(0.3))
                                                  .frame(width: 110, height: 150)
                                          }
                                          Label(item.type == "photo" ? "صورة" : "فيديو",
                                                systemImage: item.type == "photo" ? "photo" : "play.rectangle")
                                              .font(.caption)
                                      }
